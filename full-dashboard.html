<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metra QC Dashboard</title>
<style>
  html, body { margin: 0; padding: 0; background: #07101E; }
  #root { min-height: 100vh; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>
<body>
<div id="root">
  <div style="color:#94A3B8;font-family:monospace;padding:40px;text-align:center;">Loading dashboard…</div>
</div>
<script>
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (root) {
      root.innerHTML = '<div style="color:#FCA5A5;font-family:monospace;padding:40px;max-width:640px;margin:0 auto;">' +
        '<div style="font-weight:700;margin-bottom:8px;">Dashboard failed to load</div>' +
        '<div style="font-size:12px;color:#94A3B8;">' + (e.message || "Unknown error") + '</div></div>';
    }
  });
</script>
<script type="text/babel" data-presets="react" src="./component.js"></script>
</body>
</html>
