<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clean Fleet Ops</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase (free tier) is this page's backend now that it's off claude.ai.
     It replaces Claude's db / assets / downloads capabilities with a real,
     self-hosted database, photo storage, and CSV download. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="app-config.js" onerror="void 0"></script>

<style>
  :root {
    color-scheme: dark;
    --bg: #060A05;
    --surface: #1A1E14;
    --surface-2: #23281A;
    --border: #414A31;
    --text: #B8FF6B;
    --text-muted: #5F8A3E;
    --accent: #9EFF1F;
    --accent-ink: #06120A;
    --good: #7FA83E;
    --good-bg: rgba(127,168,62,0.16);
    --warn: #D89614;
    --warn-bg: rgba(216,150,20,0.18);
    --bad: #C1432B;
    --bad-bg: rgba(193,67,43,0.18);
    --mono-bg: #171A10;
    --shadow: 0 1px 0 rgba(0,0,0,0.5), 0 6px 18px rgba(0,0,0,0.4);
    --grade-a: #7FA83E; --grade-a-bg: rgba(127,168,62,0.16);
    --grade-b: #9BAE4D; --grade-b-bg: rgba(155,174,77,0.16);
    --grade-c: #D89614; --grade-c-bg: rgba(216,150,20,0.16);
    --grade-d: #B5651D; --grade-d-bg: rgba(181,101,29,0.18);
    --grade-f: #A6281B; --grade-f-bg: rgba(166,40,27,0.2);
  }
  /* Daylight mode: same console, but foreground text and status colors pushed to higher
     luminance so the screen still reads under yard glare and direct sun. Lime stays the
     accent (short bursts of text: labels, active states) rather than body copy. */
  :root[data-mode="daylight"] {
    --text: #F3F6EA;
    --text-muted: #A9B79A;
    --good: #9FD65C;
    --good-bg: rgba(159,214,92,0.2);
    --warn: #FFB238;
    --warn-bg: rgba(255,178,56,0.2);
    --bad: #FF6B52;
    --bad-bg: rgba(255,107,82,0.2);
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    padding-inline: 16px;
    padding-block: 0 96px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .eyebrow {
    font-family: "Rajdhani", "IBM Plex Sans", sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .eyebrow::before { content: "// "; opacity: 0.65; }
  h1 {
    font-family: "Black Ops One", "Rajdhani", sans-serif;
    font-weight: 400;
    font-size: 36px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin: 2px 0 0;
    text-wrap: balance;
  }
  .sub { color: var(--text-muted); font-size: 12.5px; font-family: "IBM Plex Mono", monospace; margin: 5px 0 0; }
  .dashlink { font-family: "Rajdhani", sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); text-decoration: none; }
  .dashlink:hover { text-decoration: underline; }

  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--bg);
    padding-block: 8px 8px;
    border-bottom: 1px solid var(--border);
  }
  header.top::after {
    content: ""; display: block; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px;
    background: repeating-linear-gradient(135deg, var(--accent) 0 10px, var(--bg) 10px 20px);
    opacity: 0.9;
  }
  .headrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .headrow { align-items: center !important; flex-wrap: nowrap !important; }
  .titleline { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .titleline h1 { font-size: 18px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titleline .eyebrow { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .infobar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 10px; }
  .beacon-wrap { position: relative; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .beacon-btn {
    display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 2px; padding: 6px 9px; cursor: pointer; font-family: "IBM Plex Mono", monospace; font-size: 10px;
    font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted);
  }
  .beacon-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: #FFB238; }
  .beacon-btn[data-state="live"] .beacon-dot { background: #39FF5A; box-shadow: 0 0 6px #39FF5A, 0 0 12px rgba(57,255,90,0.6); animation: beaconPulse 1.4s ease-in-out infinite; }
  .beacon-btn[data-state="live"] { color: #39FF5A; border-color: rgba(57,255,90,0.5); }
  .beacon-btn[data-state="degraded"] .beacon-dot, .beacon-btn[data-state="connecting"] .beacon-dot { background: #FFB238; box-shadow: 0 0 6px #FFB238; animation: beaconPulse 0.9s ease-in-out infinite; }
  .beacon-btn[data-state="degraded"], .beacon-btn[data-state="connecting"] { color: #FFB238; border-color: rgba(255,178,56,0.5); }
  .beacon-btn[data-state="down"] .beacon-dot { background: #FF3B30; box-shadow: 0 0 8px #FF3B30; animation: beaconPulse 0.6s steps(2, jump-none) infinite; }
  .beacon-btn[data-state="down"] { color: #FF6B52; border-color: rgba(255,59,48,0.6); }
  @keyframes beaconPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.25; transform: scale(0.8); } }
  @media (prefers-reduced-motion: reduce) { .beacon-dot { animation: none !important; } }
  .beacon-panel {
    display: none; position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; width: 250px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 10px 12px; box-shadow: var(--shadow);
  }
  .beacon-panel.open { display: block; }
  .beacon-row { display: flex; justify-content: space-between; gap: 10px; font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 4px 0; border-bottom: 1px dashed var(--border); }
  .beacon-row:last-child { border-bottom: none; }
  .beacon-row .ok { color: #39FF5A; } .beacon-row .warn { color: #FFB238; } .beacon-row .bad { color: #FF6B52; } .beacon-row .wait { color: var(--text-muted); }
  .stage-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stage-btn {
    font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase;
    min-height: 48px; padding: 8px 10px; border-radius: 2px; border: 2px solid var(--border); background: var(--mono-bg);
    color: var(--text-muted); cursor: pointer; line-height: 1.15;
  }
  .stage-btn small { display: block; font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.02em; text-transform: none; opacity: 0.85; }
  .stage-btn.on-after { background: var(--good); border-color: var(--good); color: var(--bg); }
  .stage-btn.on-before { background: #4DA3FF; border-color: #4DA3FF; color: var(--bg); }
  .stage-tag { display: inline-flex; padding: 2px 7px; border-radius: 2px; font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid currentColor; }
  .stage-tag.before { color: #4DA3FF; background: rgba(77,163,255,0.14); }
  .baseline-note { font-size: 12px; color: #4DA3FF; background: rgba(77,163,255,0.1); border-left: 3px solid #4DA3FF; padding: 8px 10px; border-radius: 2px; }
  .fullwrap { margin-inline: -16px; }
  .fullnote { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--warn); padding: 0 16px 8px; }
  .fullframe { display: block; width: 100%; height: calc(100vh - 150px); min-height: 520px; border: 0; background: #07101E; }
  .infobar .legend { margin-top: 0; gap: 4px 12px; }
  .infobar .legend-item { font-size: 9.5px; }
  .tab {
    font-family: "Rajdhani", sans-serif;
    font-weight: 600; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 7px 12px; border-radius: 2px; white-space: nowrap; flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
  }
  .tab.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.3); }

  main { padding-top: 18px; display: flex; flex-direction: column; gap: 16px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 18px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    font-family: "Rajdhani", sans-serif;
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .card h2 .bar { width: 4px; height: 16px; background: var(--accent); border-radius: 1px; display: inline-block; }
  .hint { font-size: 12px; color: var(--text-muted); margin: -8px 0 14px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; }
  .field label .req { color: var(--bad); }
  .field input[type="text"], .field input[type="date"], .field input[type="number"], .field select, .field textarea {
    font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 14px; color: var(--text);
    background: var(--mono-bg); border: 1px solid var(--border); border-radius: 2px;
    padding: 9px 10px; width: 100%; min-height: 44px;
  }
  .field textarea { min-height: 0; }
  /* Numbers, codes and IDs stay monospace for scan-ability; free-text/name fields read
     better in the body face, so only the code-like fields opt back into mono here. */
  #f_railcarNumber, #f_trainNumber, #f_employeeId, #f_scheduledMin, #f_actualMin,
  .field input[type="date"] {
    font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field.err input, .field.err select { border-color: var(--bad); }
  .field .errtext { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--bad); }
  .mono { font-family: "IBM Plex Mono", monospace; }

  .checklist { display: flex; flex-direction: column; gap: 10px; }
  .checkrow { display: flex; align-items: center; gap: 10px; font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 13.5px; }
  .checkrow input { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
  .checkcount { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-top: 4px; }

  .area-row { border-top: 1px solid var(--border); padding-block: 14px; display: flex; flex-direction: column; gap: 10px; }
  .area-row:first-of-type { border-top: none; padding-top: 2px; }
  .area-name { font-family: "Rajdhani", sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; }
  .scorebar { display: flex; gap: 6px; }
  .scorebtn {
    flex: 1; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 15px;
    padding: 12px 0; min-height: 44px; border-radius: 2px; border: 2px solid var(--border); background: var(--mono-bg);
    color: var(--text-muted); cursor: pointer; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.25);
  }
  .progress-track { height: 6px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin: 2px 0 14px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .2s ease; }
  .calib-toggle { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--accent); background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline; }
  .calib-box { display: none; font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 12px; color: var(--text-muted); background: var(--surface-2); border-left: 2px solid var(--accent); border-radius: 2px; padding: 8px 10px; }
  .calib-box.open { display: block; }
  .calib-box div + div { margin-top: 3px; }
  .chiprow { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; padding: 5px 10px; border-radius: 2px; border: 1px solid var(--border); background: var(--mono-bg); color: var(--text-muted); cursor: pointer; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .scorebtn.sel-5, .scorebtn.sel-4 { background: var(--good); border-color: var(--good); color: var(--bg); }
  .scorebtn.sel-3 { background: var(--warn); border-color: var(--warn); color: var(--bg); }
  .scorebtn.sel-2, .scorebtn.sel-1 { background: var(--bad); border-color: var(--bad); color: var(--bg); }
  .area-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .area-meta input[type="text"] { flex: 1; min-width: 160px; font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 13.5px; padding: 7px 9px; border-radius: 2px; border: 1px solid var(--border); background: var(--mono-bg); color: var(--text); min-height: 40px; }
  .photo-toggle { display: flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--text-muted); white-space: nowrap; }
  .photo-toggle input { accent-color: var(--accent); }

  .score-summary { display: flex; gap: 16px; align-items: baseline; padding: 12px 14px; background: var(--surface-2); border-radius: 2px; margin-top: 4px; flex-wrap: wrap; }
  .score-summary .big { font-family: "IBM Plex Mono", monospace; font-size: 26px; font-weight: 700; }
  .score-summary .lbl { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }

  .pill { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 2px; font-size: 10.5px; font-weight: 700; font-family: "IBM Plex Mono", monospace; letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid currentColor; }
  .pill.good { background: var(--good-bg); color: var(--good); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }

  .exception-card { border: 1px solid var(--bad); border-left: 6px solid var(--bad); background: var(--bad-bg); border-radius: 2px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .exception-card .title { font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--bad); }
  .exception-card .title::before { content: "\25B2 "; }

  .cert-row { display: flex; align-items: flex-start; gap: 10px; }
  .cert-row input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex-shrink: 0; }
  .cert-row p { margin: 0; font-size: 13px; line-height: 1.5; }

  footer.submitbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--surface);
    border-top: 3px solid var(--accent);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .submitbar-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .submitbtn {
    font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 13.5px; letter-spacing: 0.06em; text-transform: uppercase;
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 2px;
    padding: 12px 20px; cursor: pointer; flex-shrink: 0;
  }
  .submitbtn:disabled { opacity: 0.5; cursor: default; }
  .statusmsg { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-muted); flex: 1; }
  .statusmsg.err { color: var(--bad); }
  .statusmsg.ok { color: var(--good); }

  .logtoolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn-secondary {
    font-family: "Rajdhani", sans-serif; font-weight: 600; font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase;
    background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 2px;
    padding: 8px 14px; cursor: pointer;
  }
  .logcount { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-left: auto; }

  .logitem { border: 1px solid var(--border); border-radius: 2px; padding: 12px 14px; cursor: pointer; }
  .logitem + .logitem { margin-top: 10px; }
  .logitem-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .logitem-title { font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 13.5px; letter-spacing: 0.02em; text-transform: uppercase; }
  .logitem-sub { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .logitem-detail { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; font-size: 12.5px; display: none; }
  .logitem.open .logitem-detail { display: block; }
  .detail-row { display: flex; justify-content: space-between; padding: 3px 0; font-family: "IBM Plex Mono", monospace; font-size: 12px; border-bottom: 1px dashed var(--border); }
  .detail-row:last-child { border-bottom: none; }
  .empty {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    text-align: center; color: var(--text-muted); font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.03em; padding: 40px 10px;
  }
  .empty::before {
    content: ""; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--border);
    background: radial-gradient(circle, var(--accent) 0%, transparent 70%); opacity: 0.4;
  }

  .legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .legend-item {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 5px; color: var(--text-muted);
  }
  .legend-item::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .legend-item.good { color: var(--good); }
  .legend-item.warn { color: var(--warn); }
  .legend-item.bad { color: var(--bad); }

  .modebtn {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); border-radius: 2px;
    padding: 6px 10px; cursor: pointer; white-space: nowrap;
  }
  .modebtn:hover { border-color: var(--accent); color: var(--accent); }
  .headrow-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

  .photo-block { display: flex; flex-direction: column; gap: 8px; }
  .photo-thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
  .photo-thumb { position: relative; width: 64px; height: 64px; border-radius: 2px; overflow: hidden; border: 1px solid var(--border); background: var(--mono-bg); }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-thumb .rm {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,0.6); color: #fff; border: none; font-size: 11px; line-height: 18px; padding: 0; cursor: pointer;
  }
  .photo-add-label {
    display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    padding: 8px 12px; border-radius: 2px; border: 1px dashed var(--bad); color: var(--bad);
    background: var(--surface); cursor: pointer; width: fit-content;
  }
  .photo-add-label input[type="file"] { display: none; }
  .photo-uploading { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-muted); }

  // ---- Live connection beacon ----
  // Green (blinking) = every source connected. Amber = page works but a source is degraded or
  // still connecting. Red = no network or the inspection database is unreachable (can't submit).
  var SOURCES = [
    { key: "network", label: "Network" },
    { key: "db", label: "Inspection database" },
    { key: "log", label: "Inspection log feed" },
    { key: "ca", label: "Corrective action feed" },

  var CRITICAL_SOURCES = { network: 1, db: 1 };
  var outbox = [], lastSync = 0;
  var sourceState = {};
  SOURCES.forEach(function (src) { sourceState[src.key] = "wait"; });
  sourceState.network = navigator.onLine === false ? "bad" : "ok";
  sourceState.sync = "ok";
  function setSource(key, st) {
    if (sourceState[key] === st) return;
    sourceState[key] = st;
    renderBeacon();
  }
  // Types text into an element one character at a time (the connectivity bar and ticker use it). Skips the effect for reduced motion.
  function typeIntoEl(el, text, force) {
    if (!el) return;
    if (!force && el.textContent === text) return;
    clearTimeout(el._tt);
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = text; return; }
    var i = 0; el.textContent = ""; el.classList.add("typing");
    (function step() {
      if (i < text.length) { el.textContent += text.charAt(i++); el._tt = setTimeout(step, 28 + Math.random() * 30); }
      else el._tt = setTimeout(function () { el.classList.remove("typing"); }, 900);
    })();
  }
  window.typeInto = typeIntoEl;
  function renderBeacon() {
    var btn = document.getElementById("beaconBtn");
    if (!btn) return;
    var keys = SOURCES.map(function (x) { return x.key; });
    var critDown = keys.some(function (k) { return CRITICAL_SOURCES[k] && sourceState[k] === "bad"; });
    var anyBad = keys.some(function (k) { return sourceState[k] === "bad" || sourceState[k] === "warn"; });
    var anyWait = keys.some(function (k) { return sourceState[k] === "wait"; });
    var state = critDown ? "down" : (anyBad ? "degraded" : (anyWait ? "connecting" : "live"));
    var label = { down: "Offline", degraded: "Degraded", connecting: "Connecting", live: "Live" }[state];
    if (outbox.length && state === "degraded") label = "Unsent " + outbox.length;
    btn.setAttribute("data-state", state);
    typeIntoEl(document.getElementById("beaconLabel"), label);
    var words = { ok: "Connected", warn: "Issue", bad: "Disconnected", wait: "Connecting" };
    var cls = { ok: "ok", warn: "warn", bad: "bad", wait: "wait" };
    var rows = SOURCES.map(function (x) {
      var st = sourceState[x.key], wd = x.key === "sync" ? (st === "ok" ? "All saved" : outbox.length + " waiting") : words[st];
      return '<div class="beacon-row"><span>' + esc(x.label) + '</span><span class="' + cls[st] + '">' + wd + '</span></div>';
    }).join("");
    rows += '<div class="beacon-row"><span>Last sync</span><span>' + (lastSync ? new Date(lastSync).toTimeString().slice(0, 8) : "-") + '</span></div>';
    rows += '<button type="button" class="btn-secondary" id="syncNowBtn" style="margin-top:8px;width:100%;min-height:34px;">Reconnect &amp; sync now</button>';
    document.getElementById("beaconPanel").innerHTML = rows;
    var sb = document.getElementById("syncNowBtn"); if (sb) sb.addEventListener("click", function (e) { e.stopPropagation(); syncNow(); });
  }
  window.addEventListener("online", function () { setSource("network", "ok"); retryDelay = 5000; reconnect(); flushOutbox(); });
  window.addEventListener("offline", function () { setSource("network", "bad"); });
  // Anything still "connecting" after 12 seconds is treated as failed, so the beacon never
  // sits amber forever on a source that silently never answered.
  setTimeout(function () {
    SOURCES.forEach(function (x) {
      if (sourceState[x.key] === "wait") setSource(x.key, CRITICAL_SOURCES[x.key] ? "bad" : "warn");
    });
  }, 12000);

  // ---- capability bootstrap ----
  // ---- Firebase bootstrap (replaces Claude's db / assets / downloads) ----
  function needsSetup() {
    return !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf("PASTE_") === 0;
  }

  function renderSetupNotice() {
    var html = '<div class="card setup-card">';
    html += '<h2><span class="bar" style="background:var(--warn);"></span>Setup Needed</h2>';
    html += '<p>This page is not connected to a database yet. Open <code>index.html</code>, find the <code>FIREBASE_CONFIG</code> block near the top of the script, and paste in your Firebase project\'s config values. Full instructions are in the comment right above it in the source file.</p>';
    html += '<p>Once that\'s filled in and re-uploaded to GitHub, this notice disappears and the form goes live.</p>';

  function initFirebase() {
    if (needsSetup()) { renderSetupNotice(); ["db","log","ca","targets","assets","downloads"].forEach(function (k) { setSource(k, "bad"); }); return; }
    if (typeof firebase === "undefined") {
      ["db","log","ca","targets"].forEach(function (k) { setSource(k, "bad"); });
      setStatus("Firebase failed to load. Check your internet connection and reload.", "err");
      return;
    }
    if (!(firebase.apps && firebase.apps.length)) firebase.initializeApp(FIREBASE_CONFIG);
    var fsDb = firebase.firestore();
    var fbStorage = firebase.storage();
    // Yards and layover points are notorious dead zones. This lets the form keep working
    // offline (reads from cache, writes queue locally) and syncs automatically once a
    // connection comes back, instead of silently failing a submission with no signal.
    try {
      (window.__fsPersist ? Promise.resolve() : (window.__fsPersist = true, fsDb.enablePersistence({ synchronizeTabs: true }))).catch(function (err) {
        // "failed-precondition" = another tab already has persistence open; "unimplemented"
        // = this browser doesn't support it. Either way the app still works, just without
        // the offline cache in this tab.
      });
    } catch (e) {}
    firebase.auth().signInAnonymously().then(function () {
      db = { collection: function (name) { return fsDb.collection(name); } };
      assetsCap = makeAssetsShim(fbStorage);
      downloadsCap = makeDownloadsShim();
      setSource("db", "ok"); setSource("assets", "ok"); setSource("downloads", "ok");
      setStatus("Ready. Fill in the form, then submit.");
      subscribeLog();
      subscribeCA();
      subscribeTargets();
    }).catch(function (e) {
      ["db","log","ca","targets"].forEach(function (k) { setSource(k, "bad"); });
      setStatus("Couldn't connect to storage: " + (e && e.message ? e.message : "sign-in failed"), "err");
    });
  }

  // Thin shims that make the Firebase SDK look like the same db/assets/
  // downloads interface this page originally used on claude.ai, so the
  // rest of the app code below didn't need to change.
  function makeAssetsShim(storage) {
    return {
      upload: function (file) {
        var id = "p_" + Date.now() + "_" + Math.random().toString(36).slice(2, 9);
        var ref = storage.ref().child("inspection-photos/" + id + "_" + (file.name || "photo.jpg"));
        return ref.put(file).then(function () { return ref.getDownloadURL(); }).then(function (url) {
          return { id: id, url: url };
        });
      }
    };
  }
  function makeDownloadsShim() {
    return {
      save: function (opts) {
        return new Promise(function (resolve) {
          var blob = new Blob([opts.data], { type: "text/csv" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url; a.download = opts.filename;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          resolve({ status: "saved" });
        });
      }
    };
  }

  // ---- helpers ----
  function scoreColor(score) {
    if (score === null) return "";
    return "sel-" + score;
  }
  function pillClassFor(avg) {
    if (avg === null) return "warn";
    if (avg >= 4) return "good";
    if (avg >= 3) return "warn";
    return "bad";
  }
  function computeTotals(areas) {
    var scored = areas.filter(function (a) { return a.score !== null; });
    var total = scored.reduce(function (s, a) { return s + a.score; }, 0);
    var avg = scored.length ? (total / scored.length) : null;
    var criticals = areas.filter(function (a) { return a.score !== null && a.score <= 2; });
    return { total: total, avg: avg, scoredCount: scored.length, criticals: criticals };
  }

  // ---- Grading: every inspection starts at A (100) and loses points for what's found ----
  var GRADE_DEDUCTIONS = { 5: 0, 4: 2, 3: 5, 2: 10, 1: 25 };
  // Bands with +/- tiers. F has no modifier -- once it's failing, the +/- distinction
  // doesn't matter operationally.
  var GRADE_BANDS = [
    // Standard 90/80/70/60 scale: A 90-100, B 80-89, C 70-79, D 60-69, F below 60.
    // Within each band: +  = top 3 points (x7-x9, A+ 97-100), plain = middle, - = bottom 3 (x0-x2).
    { min: 97, letter: "A+" }, { min: 93, letter: "A" }, { min: 90, letter: "A-" },
    { min: 87, letter: "B+" }, { min: 83, letter: "B" }, { min: 80, letter: "B-" },
    { min: 77, letter: "C+" }, { min: 73, letter: "C" }, { min: 70, letter: "C-" },
    { min: 67, letter: "D+" }, { min: 63, letter: "D" }, { min: 60, letter: "D-" },
    { min: -Infinity, letter: "F" }
  ];
  function letterForPct(pct) {
    for (var i = 0; i < GRADE_BANDS.length; i++) {
      if (pct >= GRADE_BANDS[i].min) return GRADE_BANDS[i].letter;
    }
    return "F";
  }
  function baseLetter(letter) {
    return letter.charAt(0);
  }
  // A NO-GO (1) or major exception (2) anywhere caps the letter at C, no matter what the
  // remaining math says. A blended average can hide a single unacceptable defect; this can't.
  // Scores already at C or below keep their own letter.
  function capForCritical(letter, hasCritical) {
    if (hasCritical && (baseLetter(letter) === "A" || baseLetter(letter) === "B")) return "C";
    return letter;
  }
  function computeGrade(areas) {
    var scored = areas.filter(function (a) { return a.score !== null; });
    var deduction = scored.reduce(function (s, a) { return s + (GRADE_DEDUCTIONS[a.score] || 0); }, 0);
    var pct = Math.max(0, 100 - deduction);
    var hasCritical = areas.some(function (a) { return a.score !== null && a.score <= 2; });
    return { pct: pct, letter: capForCritical(letterForPct(pct), hasCritical), hasCritical: hasCritical };
  }

  }

  }
  function selectHtml(id, options, current, placeholder) {
    var out = '<select id="' + id + '">';
    if (placeholder) out += '<option value="">' + esc(placeholder) + '</option>';
    options.forEach(function (o) {
      out += '<option value="' + esc(o) + '"' + (o === current ? " selected" : "") + '>' + esc(o) + '</option>';
    });
    out += '</select>';
    return out;
  }
  function openCorrectiveActions() {
    return (caDocs || []).filter(function (c) { return c.status === "Open" || c.status === "In Progress"; });
  }
  function caSelectHtml(current) {
    var opts = openCorrectiveActions();
    var out = '<select id="f_reinspectsCaId">';
    out += '<option value="">' + (opts.length ? "Select open corrective action" : "No open corrective actions") + '</option>';
    opts.forEach(function (c) {
      var label = "Car " + c.railcarNumber + " — " + c.area + " (" + c.district + ", due " + (c.dueDate || "no due date") + ")";
      out += '<option value="' + esc(c._id) + '"' + (c._id === current ? " selected" : "") + '>' + esc(label) + '</option>';
    });
    out += '</select>';
    return out;
  }

  // ---- Suggestion datalists: seeded from real known locations, then self-building from
  // whatever inspectors and supervisors actually type into real submitted inspections. ----
  function setDatalistOptions(id, values) {
    var el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = values.map(function (v) { return '<option value="' + esc(v) + '">'; }).join("");
  }
  function refreshSuggestDatalists() {
    var yards = {}, inspectors = {}, supervisors = {};
    Object.keys(YARD_HINTS).forEach(function (d) { YARD_HINTS[d].forEach(function (y) { yards[y] = 1; }); });
    logDocs.forEach(function (d) {
      if (d.yard) yards[d.yard] = 1;
      if (d.inspectorName) inspectors[d.inspectorName] = 1;
      if (d.supervisor) supervisors[d.supervisor] = 1;
    });
    setDatalistOptions("dl_yard", Object.keys(yards).sort());
    setDatalistOptions("dl_inspector", Object.keys(inspectors).sort());
    setDatalistOptions("dl_supervisor", Object.keys(supervisors).sort());
  }
  function refreshCarDatalist(district) {
    setDatalistOptions("dl_railcar", CAR_ROSTER[district] || []);
  }

  function wireNewHandlers() {
    var ids = ["railcarNumber", "trainNumber", "date", "district", "yard", "shift", "inspectionType",
      "inspectorName", "supervisor", "employeeId", "scheduledMin", "actualMin", "certName", "certDate", "reinspectsCaId", "jiraTicket"];
    ids.forEach(function (id) {
      var el = document.getElementById("f_" + id);
      if (!el) return;
      el.addEventListener("input", function () { state[id] = el.value; });
      el.addEventListener("change", function () { state[id] = el.value; });
    });
    ["railcarNumber", "date"].forEach(function (id) {
      var el = document.getElementById("f_" + id);
      if (el) el.addEventListener("input", resetDupWarning);
    });
    var trainEl = document.getElementById("f_trainNumber");
    if (trainEl) trainEl.addEventListener("input", updateTrainLookup);
    updateTrainLookup();
    var certify = document.getElementById("f_certify");
    if (certify) certify.addEventListener("change", function () { state.certify = certify.checked; });

    var inspectionTypeEl = document.getElementById("f_inspectionType");
    if (inspectionTypeEl) inspectionTypeEl.addEventListener("change", function () {
      state.inspectionType = inspectionTypeEl.value;
      if (state.inspectionType !== "Follow-up") state.reinspectsCaId = "";
      if (state.inspectionType !== "Complaint-Driven") state.jiraTicket = "";
      renderNew();
    });

    var districtEl = document.getElementById("f_district");
    if (districtEl) districtEl.addEventListener("change", function () { refreshCarDatalist(districtEl.value); });
    refreshCarDatalist(state.district);

    document.querySelectorAll("[data-stage]").forEach(function (el) {
      el.addEventListener("click", function () {
        state.cleaningStage = el.getAttribute("data-stage");
        delete errors.cleaningStage;
        resetDupWarning();
        renderNew();
      });
    });

    document.querySelectorAll("[data-calib-toggle]").forEach(function (el) {
      el.addEventListener("click", function () {
        var box = document.querySelector('[data-calib-box="' + el.getAttribute("data-calib-toggle") + '"]');
        if (box) box.classList.toggle("open");
      });
    });
    document.querySelectorAll("[data-area-tag]").forEach(function (el) {
      el.addEventListener("click", function () {
        var i = parseInt(el.getAttribute("data-area-tag"), 10);
        var tag = el.getAttribute("data-tag");
        var current = state.areas[i].comments;
        if (current.indexOf(tag) !== -1) return;
        state.areas[i].comments = current ? (current + ", " + tag) : tag;
        renderNew();
      });
    });

    document.querySelectorAll("[data-checklist]").forEach(function (el) {
      el.addEventListener("change", function () {
        state.checklist[parseInt(el.getAttribute("data-checklist"), 10)] = el.checked;
        renderNew();
      });
    });
    document.querySelectorAll("[data-area]").forEach(function (el) {
      el.addEventListener("click", function () {
        var i = parseInt(el.getAttribute("data-area"), 10);
        var score = parseInt(el.getAttribute("data-score"), 10);
        state.areas[i].score = (state.areas[i].score === score) ? null : score;
        if (state.areas[i].score === null || state.areas[i].score > 2) state.areas[i].exceptionAction = "";
        renderNew();
        // Auto-advance: jump to the exception card if one just opened, otherwise to the
        // next unscored area, so the inspector isn't hunting through 13 areas by hand.
        requestAnimationFrame(function () {
          var sc = state.areas[i].score;
          if (sc !== null && sc <= 2) {
            var card = document.querySelector('[data-exception-card="' + i + '"]');
            if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
            return;
          }
          var next = -1;
          for (var k = i + 1; k < state.areas.length; k++) { if (state.areas[k].score === null) { next = k; break; } }
          if (next === -1) { for (var k2 = 0; k2 < state.areas.length; k2++) { if (state.areas[k2].score === null) { next = k2; break; } } }
          if (next !== -1) {
            var row = document.querySelector('[data-area-row="' + next + '"]');
            if (row) row.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        });
      });
    });
    document.querySelectorAll("[data-area-comment]").forEach(function (el) {
      el.addEventListener("input", function () {
        state.areas[parseInt(el.getAttribute("data-area-comment"), 10)].comments = el.value;
      });
    });
    document.querySelectorAll("[data-area-photo]").forEach(function (el) {
      el.addEventListener("change", function () {
        state.areas[parseInt(el.getAttribute("data-area-photo"), 10)].photo = el.checked;
      });
    });
    document.querySelectorAll("[data-exception]").forEach(function (el) {
      el.addEventListener("input", function () {
        state.areas[parseInt(el.getAttribute("data-exception"), 10)].exceptionAction = el.value;
      });
    });
    document.querySelectorAll("[data-photo-input]").forEach(function (el) {
      el.addEventListener("change", function () {
        var i = parseInt(el.getAttribute("data-photo-input"), 10);
        var files = Array.prototype.slice.call(el.files || []);
        el.value = "";
        if (files.length) uploadPhotos(i, files);
      });
    });
    document.querySelectorAll("[data-rmphoto]").forEach(function (el) {
      el.addEventListener("click", function () {
        var parts = el.getAttribute("data-rmphoto").split(":");
        var i = parseInt(parts[0], 10), pi = parseInt(parts[1], 10);
        state.areas[i].exceptionPhotos.splice(pi, 1);
        renderNew();
      });
    });
  }

  // Downscale a photo client-side before it goes over the wire. Yard and layover-point cell
  // signal is often marginal, and a full-resolution phone photo is overkill for evidence review.
  function compressImage(file, maxDim, quality) {
    return new Promise(function (resolve) {
      if (!file || !file.type || file.type.indexOf("image/") !== 0 || typeof document === "undefined") { resolve(file); return; }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var w = img.width, h = img.height;
        if (!w || !h || (w <= maxDim && h <= maxDim)) { resolve(file); return; }
        var scale = Math.min(maxDim / w, maxDim / h);
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(w * scale);
        canvas.height = Math.round(h * scale);
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function (blob) {
          resolve(blob ? new File([blob], file.name || "photo.jpg", { type: "image/jpeg" }) : file);
        }, "image/jpeg", quality || 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  function uploadPhotos(areaIndex, files) {
    if (!assetsCap) {
      setStatus("Photo storage isn't available in this view right now.", "err");
      return;
    }
    var msgEl = document.querySelector('[data-uploading-msg="' + areaIndex + '"]');
    if (msgEl) msgEl.style.display = "";
    uploadingCount += files.length;
    updateSubmitAvailability();
    files.forEach(function (file) {
      compressImage(file, 1600, 0.82).then(function (toUpload) {
        return assetsCap.upload(toUpload);
      }).then(function (res) {
        state.areas[areaIndex].exceptionPhotos.push({ id: res.id, url: res.url });
      }).catch(function () {
        setStatus("A photo failed to upload. Try again.", "err");
      }).then(function () {
        uploadingCount = Math.max(0, uploadingCount - 1);
        updateSubmitAvailability();
        renderNew();
      });
    });
  }

  function updateSubmitAvailability() {
    var btn = document.getElementById("submitBtn");
    if (!btn) return;
    btn.disabled = uploadingCount > 0;
    if (uploadingCount > 0) setStatus("Uploading photo evidence…");
  }

  // ---- validation + submit ----
  function validate() {
    errors = {};
    if (!state.railcarNumber.trim()) errors.railcarNumber = "Required";
    if (!state.date) errors.date = "Required";
    if (!state.district) errors.district = "Required";
    if (!state.inspectorName.trim()) errors.inspectorName = "Required";
    if (state.inspectionType === "Follow-up" && !state.reinspectsCaId) errors.reinspectsCaId = "Pick the corrective action being reinspected.";
    var unscored = state.areas.filter(function (a) { return a.score === null; });
    if (unscored.length) errors.areas = unscored.length + " area(s) still need a score.";
    var baseline = state.cleaningStage === "Before";
    if (baseline && state.inspectionType === "Follow-up") errors.cleaningStage = "A follow-up reinspection checks the crew's fix, so score it as After cleaning.";
    var missingException = baseline ? [] : state.areas.filter(function (a) { return a.score !== null && a.score <= 2 && !a.exceptionAction.trim(); });
    if (missingException.length) errors.exceptions = "Add a corrective action for every area scored 1 or 2.";
    var missingPhoto = baseline ? [] : state.areas.filter(function (a) { return a.score !== null && a.score <= 2 && a.exceptionPhotos.length === 0; });
    if (missingPhoto.length) errors.photos = "Attach at least one photo for every area scored 1 or 2 (required for NO-GOs and major exceptions).";
    if (uploadingCount > 0) errors.photos = "Wait for photo uploads to finish before submitting.";
    if (!state.certify) errors.certify = "Required";
    if (!state.certName.trim()) errors.certName = "Required";
    if (!state.certDate) errors.certDate = "Required";
    return Object.keys(errors).length === 0;
  }

  function buildPayload() {
    var totals = computeTotals(state.areas);
    var grade = computeGrade(state.areas);
    return {
      railcarNumber: state.railcarNumber.trim(),
      trainNumber: state.trainNumber.trim(),
      date: state.date,
      district: state.district,
      yard: state.yard.trim(),
      shift: state.shift,
      inspectionType: state.inspectionType,
      cleaningStage: state.cleaningStage === "Before" ? "Before" : "After",
      inspectorName: state.inspectorName.trim(),
      supervisor: state.supervisor.trim(),
      employeeId: state.employeeId.trim(),
      scheduledMin: state.scheduledMin ? Number(state.scheduledMin) : null,
      actualMin: state.actualMin ? Number(state.actualMin) : null,
      reinspectsCaId: state.reinspectsCaId || "",
      jiraTicket: state.jiraTicket.trim(),
      checklist: CHECKLIST.reduce(function (acc, label, i) { acc[label] = state.checklist[i]; return acc; }, {}),
      areas: state.areas.map(function (a) {
        return {
          name: a.name, score: a.score, comments: a.comments.trim(), photo: a.photo,
          exceptionAction: a.exceptionAction.trim(),
          exceptionPhotos: a.exceptionPhotos.map(function (p) { return { id: p.id, url: p.url }; })
        };
      }),
      totalScore: totals.total,
      avgScore: totals.avg,
      criticalCount: totals.criticals.length,
      noGoCount: state.areas.filter(function (a) { return a.score === 1; }).length,
      gradePct: grade.pct,
      gradeLetter: grade.letter,
      certifiedName: state.certName.trim(),
      certifiedDate: state.certDate,
      submittedAt: new Date().toISOString(),
    };
  }

  // ---- Duplicate-inspection guard: catches the same car getting graded twice the same day
  // by two different inspectors who don't know about each other -- a real risk once you've
  // got 30+ people spread across five districts. Warns, doesn't block (a genuine second look
  // is legitimate), and Follow-up inspections are exempt since re-checking the same car same
  // day is the whole point of that inspection type. ----
  function findDuplicateInspection() {
    var car = state.railcarNumber.trim();
    if (!car || !state.date) return null;
    var stage = state.cleaningStage === "Before" ? "Before" : "After";
    return logDocs.find(function (d) {
      return (d.railcarNumber || "").trim() === car && d.date === state.date && (isBaseline(d) ? "Before" : "After") === stage;
    }) || null;
  }
  function resetDupWarning() {
    if (!dupWarningShown) return;
    dupWarningShown = false;
    var btn = document.getElementById("submitBtn");
    if (btn) btn.textContent = "Transmit Inspection";
    setStatus("Fill in the form, then submit.");
  }

  // ---- Connection safety: every submission is written to this device FIRST, then sent with a
  // fixed record id (so a retry can never create a duplicate). It stays queued until the database
  // confirms it. A half-filled form is also saved as a draft every few seconds. ----
  var OUTBOX_KEY = "qcOutboxV1", DRAFT_KEY = "qcDraftV1", draftLast = "";
  var flushing = false, retryDelay = 5000, retryTimer = null, storeOk = true;
  function outboxLoad() {
    try { outbox = JSON.parse(localStorage.getItem(OUTBOX_KEY) || "[]") || []; } catch (e) { outbox = []; storeOk = false; }
  }
  function outboxSave() { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(outbox)); } catch (e) { storeOk = false; } }
  function syncBadge() { setSource("sync", outbox.length ? "warn" : "ok"); renderBeacon(); }
  function draftSave() {
    try {
      if (currentTab !== "new") return;
      var j = JSON.stringify(state);
      if (j === draftLast) return;
      draftLast = j;
      localStorage.setItem(DRAFT_KEY, JSON.stringify({ at: Date.now(), state: state }));
    } catch (e) {}
  }
  function draftLoad() {
    try {
      var o = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
      if (o && o.state && Date.now() - o.at < 12 * 3600 * 1000) return o.state;
    } catch (e) {}
    return null;
  }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} draftLast = ""; }
  function withTimeout(p, ms) {
    return new Promise(function (res, rej) {
      var t = setTimeout(function () { rej(new Error("timeout")); }, ms);
      p.then(function (v) { clearTimeout(t); res(v); }, function (e) { clearTimeout(t); rej(e); });
    });
  }
  function makeOutboxRecord(s) {
    var id = "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    var rec = { id: id, payload: buildPayload(), cas: [], reinsp: null, queuedAt: new Date().toISOString() };
    if (s.cleaningStage !== "Before") {
      s.areas.forEach(function (a, k) {
        if (a.score === null || a.score > 2) return;
        rec.cas.push({ id: id + "_" + k, data: {
          sourceInspectionId: id, railcarNumber: s.railcarNumber.trim(), district: s.district, area: a.name,
          severity: a.score === 1 ? "NO-GO" : "Major Exception", defectDescription: a.comments.trim(),
          probableCause: "", confirmedRootCause: "", owner: "", assignedDate: todayStr(), dueDate: "", status: "Open",
          completionDate: "", correctiveActionText: a.exceptionAction.trim(), reinspectionId: "", reinspectionResult: "",
          effectivenessVerified: false, verifiedDate: "", notes: "", createdAt: new Date().toISOString() } });
      });
      if (s.inspectionType === "Follow-up" && s.reinspectsCaId) {
        var ca = (caDocs || []).find(function (c) { return c._id === s.reinspectsCaId; });
        if (ca) {
          var m = s.areas.find(function (a) { return a.name === ca.area; });
          var rep = !!(m && m.score !== null && m.score <= 2), result = rep ? "Repeat Defect" : "Pass";
          rec.reinsp = { caId: s.reinspectsCaId, patch: { reinspectionId: id, reinspectionResult: result, status: rep ? "Open" : "Completed",
            completionDate: rep ? (ca.completionDate || "") : todayStr(), notes: (ca.notes ? ca.notes + " | " : "") + "Reinspected " + todayStr() + ": " + result } };
        }
      }
    }
    return rec;
  }
  function sendOne(rec) {
    var T = 20000;
    return withTimeout(db.collection("inspections").doc(rec.id).set(rec.payload), T).then(function () {
      return Promise.all(rec.cas.map(function (c) { return withTimeout(db.collection("correctiveActions").doc(c.id).set(c.data), T); }));
    }).then(function () {
      return rec.reinsp ? withTimeout(db.collection("correctiveActions").doc(rec.reinsp.caId).update(rec.reinsp.patch), T) : null;
    });
  }
  function scheduleRetry() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(flushOutbox, retryDelay);
    retryDelay = Math.min(retryDelay * 2, 60000);
  }
  function flushOutbox() {
    if (flushing || !outbox.length) return;
    if (!db) { scheduleRetry(); return; }
    flushing = true;
    (function next() {
      if (!outbox.length) {
        flushing = false; lastSync = Date.now(); retryDelay = 5000; syncBadge(); setSource("db", "ok");
        setStatus("All inspections saved to the database.", "ok");
        return;
      }
      sendOne(outbox[0]).then(function () {
        outbox.shift(); outboxSave(); syncBadge(); storage.checkedAt = 0; next();
      }).catch(function (e) {
        flushing = false;
        if (e && e.code === "quota_exceeded") { setStatus("Database full (5,000 records). " + outbox.length + " inspection(s) are safe on this device. Export and roll up older months, then tap Sync now.", "err"); return; }
        setSource("db", "warn");
        setStatus(outbox.length + " inspection" + (outbox.length === 1 ? " is" : "s are") + " saved on this device and will send automatically when the connection is back.", "err");
        scheduleRetry();
      });
    })();
  }
  function syncNow() { retryDelay = 5000; clearTimeout(retryTimer); if (!db) { reconnect(); } flushOutbox(); }

  function submit() {
    if (!validate()) {
      renderNew();
      setStatus("Fix the highlighted fields before submitting.", "err");
      var firstErr = document.querySelector(".field.err, .exception-card");
      if (firstErr) firstErr.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    var btn = document.getElementById("submitBtn");
    if (state.inspectionType !== "Follow-up" && !dupWarningShown) {
      var dup = findDuplicateInspection();
      if (dup) {
        dupWarningShown = true;
        btn.textContent = "Confirm & Transmit Anyway";
        setStatus("Car " + state.railcarNumber.trim() + " already has a " + (state.cleaningStage === "Before" ? "before-cleaning" : "after-cleaning") + " inspection today by " + (dup.inspectorName || "another inspector") + ". Click Transmit again to submit anyway.", "err");
        return;
      }
    }
    var s = state, rec = makeOutboxRecord(s);
    outbox.push(rec); outboxSave(); syncBadge();
    saveLastUsed(s); clearDraft();
    dupWarningShown = false; btn.textContent = "Transmit Inspection";
    state = freshState(); renderNew();
    var online = navigator.onLine !== false && !!db;
    setStatus(online ? "Saved. Sending to the database..." : "Saved on this device. It will send by itself when the connection returns.", online ? "ok" : "err");
    if (!storeOk) setStatus("Warning: this browser would not save a local copy. Stay on this page until it says all saved.", "err");
    flushOutbox();
  }

  // ---- Corrective-action creation + reinspection linkage ----
  // Every area scored 1 or 2 opens its own trackable corrective action, instead of living only
  // as a text field on the inspection -- that's what makes reinspection pass rate and
  // repeat-defect rate computable from real data instead of by hand.
  function createCorrectiveActions(inspectionId, s) {
    if (!db) return Promise.resolve();
    if (s.cleaningStage === "Before") return Promise.resolve();
    var criticalAreas = s.areas.filter(function (a) { return a.score !== null && a.score <= 2; });
    if (!criticalAreas.length) return Promise.resolve();
    return Promise.all(criticalAreas.map(function (a) {
      return db.collection("correctiveActions").add({
        sourceInspectionId: inspectionId,
        railcarNumber: s.railcarNumber.trim(),
        district: s.district,
        area: a.name,
        severity: a.score === 1 ? "NO-GO" : "Major Exception",
        defectDescription: a.comments.trim(),
        probableCause: "",
        confirmedRootCause: "",
        owner: "",
        assignedDate: todayStr(),
        dueDate: "",
        status: "Open",
        completionDate: "",
        correctiveActionText: a.exceptionAction.trim(),
        reinspectionId: "",
        reinspectionResult: "",
        effectivenessVerified: false,
        verifiedDate: "",
        notes: "",
        createdAt: new Date().toISOString()
      });
    }));
  }
  // A "Follow-up" inspection that names which corrective action it's reinspecting writes the
  // result back onto that CA: same area still scoring <=2 is a Repeat Defect and reopens it,
  // anything else is a Pass and closes it out (pending manual effectiveness verification).
  function linkReinspection(inspectionId, s) {
    if (!db || s.inspectionType !== "Follow-up" || !s.reinspectsCaId || s.cleaningStage === "Before") return Promise.resolve();
    var ca = (caDocs || []).find(function (c) { return c._id === s.reinspectsCaId; });
    if (!ca) return Promise.resolve();
    var matchArea = s.areas.find(function (a) { return a.name === ca.area; });
    var repeatDefect = !!(matchArea && matchArea.score !== null && matchArea.score <= 2);
    var result = repeatDefect ? "Repeat Defect" : "Pass";
    return db.collection("correctiveActions").doc(s.reinspectsCaId).update({
      reinspectionId: inspectionId,
      reinspectionResult: result,
      status: repeatDefect ? "Open" : "Completed",
      completionDate: repeatDefect ? (ca.completionDate || "") : todayStr(),
      notes: (ca.notes ? ca.notes + " | " : "") + "Reinspected " + todayStr() + ": " + result
    });
  }
  function updateCA(id, patch) {
    if (!db) return;
    db.collection("correctiveActions").doc(id).update(patch).catch(function () {
      setStatus("Couldn't update corrective action.", "err");
    });
  }

  // ---- Log tab ----
  function subscribeLog() {
    if (!db || logUnsub) return;
    logUnsub = db.collection("inspections").orderBy("submittedAt", "desc").limit(1000).onSnapshot(function (snap) {
      setSource("log", "ok");
      logDocs = snap.docs.map(function (d) { return Object.assign({ _id: d.id }, d.data()); });
      refreshSuggestDatalists();
      if (currentTab === "log") renderLog();
      if (currentTab === "dash") renderDash();
      pushFullData();
    }, function () {
      setSource("log", "bad");
      setStatus("Couldn't load the log.", "err");
    });
  }

  function subscribeCA() {
    if (!db || caUnsub) return;
    caUnsub = db.collection("correctiveActions").orderBy("assignedDate", "desc").limit(1000).onSnapshot(function (snap) {
      setSource("ca", "ok");
      caDocs = snap.docs.map(function (d) { return Object.assign({ _id: d.id }, d.data()); });
      if (currentTab === "ca") renderCA();
      if (currentTab === "dash") renderDash();
      if (currentTab === "new") renderNew();
      pushFullData();
    }, function () {
      setSource("ca", "bad");
      setStatus("Couldn't load corrective actions.", "err");

  // ---- Cleaning effectiveness: arrival baseline vs after-cleaning result. The matched-car lift
  // (same car, same day, scored both ways) is the fair number; the overall averages can differ
  // just because different cars were sampled. ----
  function effectivenessHtml(allDocs) {
    var before = allDocs.filter(isBaseline);
    var after = graded(allDocs);
    var avg = function (arr) { return arr.length ? arr.reduce(function (s, d) { return s + (d.gradePct || 0); }, 0) / arr.length : null; };
    var afterByKey = {};
    after.forEach(function (d) { afterByKey[(d.railcarNumber || "") + "|" + d.date] = d; });
    var pairs = [];
    before.forEach(function (b) {
      var a = afterByKey[(b.railcarNumber || "") + "|" + b.date];
      if (a) pairs.push({ district: b.district || "Unassigned", lift: (a.gradePct || 0) - (b.gradePct || 0) });
    });
    var avgB = avg(before), avgA = avg(after);
    var lift = pairs.length ? pairs.reduce(function (s, p) { return s + p.lift; }, 0) / pairs.length : null;
    var out = '<div class="card">';
    out += '<h2><span class="bar" style="background:#4DA3FF;"></span>Cleaning Effectiveness (Before vs. After)</h2>';
    if (!before.length) {
      out += '<p class="hint" style="margin:0;">No arrival baselines yet. Score a car as <strong>Before cleaning</strong> when it arrives, then score the same car <strong>After cleaning</strong> before it departs, and the lift the crew delivered shows up here.</p>';
      return out + '</div>';
    }
    out += '<p class="hint">Lift is measured only on cars scored both ways on the same day, so the comparison is fair. ' + pairs.length + ' matched car' + (pairs.length === 1 ? "" : "s") + ' so far.</p>';
    out += '<div class="kpi-grid">';
    out += kpiTile(avgB === null ? "-" : avgB.toFixed(1) + "%", "Arrival Baseline Avg (" + before.length + ")");
    out += kpiTile(avgA === null ? "-" : avgA.toFixed(1) + "%", "After Cleaning Avg (" + after.length + ")");
    out += kpiTile(lift === null ? "-" : (lift >= 0 ? "+" : "") + lift.toFixed(1) + " pts", "Avg Lift, Matched Cars");
    out += kpiTile(pairs.length, "Matched Cars");
    out += '</div>';
    if (pairs.length) {
      var byD = {};
      pairs.forEach(function (p) { if (!byD[p.district]) byD[p.district] = []; byD[p.district].push(p.lift); });
      out += '<div style="overflow-x:auto;margin-top:12px;"><table class="disttable"><thead><tr><th>District</th><th class="num">Matched Cars</th><th class="num">Avg Lift</th></tr></thead><tbody>';
      Object.keys(byD).sort().forEach(function (k) {
        var l = byD[k].reduce(function (s, x) { return s + x; }, 0) / byD[k].length;
        out += '<tr><td>' + esc(k) + '</td><td class="num">' + byD[k].length + '</td><td class="num">' + (l >= 0 ? "+" : "") + l.toFixed(1) + ' pts</td></tr>';
      });
      out += '</tbody></table></div>';
    }
    return out + '</div>';
  }

  function monthlyTargetsHtml(source) {
    var thisMonth = todayStr().slice(0, 7);
    var actualThisMonth = {};
    (source || []).forEach(function (d) {
      if ((d.date || "").slice(0, 7) === thisMonth) {
        var k = d.district || "Unassigned";
        actualThisMonth[k] = (actualThisMonth[k] || 0) + 1;
      }
    });

    out += '<h2><span class="bar"></span>Monthly Grading Targets</h2>';

    DISTRICTS.forEach(function (d) {
      var target = monthlyTargets[d] || 0;
      var actual = actualThisMonth[d] || 0;
      var pct = target > 0 ? Math.min(100, Math.round(actual / target * 100)) : null;

    });
    out += '</tbody></table></div>';
    out += '</div>';

  }

      var avgDaysD = closedD.length ? (closedD.reduce(function (s, c) {

    html += '<h2><span class="bar"></span>By District</h2>';
    html += '<p class="hint">Grades below ' + MIN_SAMPLE + ' inspections are marked insufficient data &mdash; too small a sample to post a letter grade against a district.</p>';
    html += '<div style="overflow-x:auto;"><table class="disttable"><thead><tr><th>District</th><th class="num">Inspections</th><th class="num">Grade</th><th class="num">Avg %</th><th class="num">Critical Areas</th><th class="num">NO-GOs</th></tr></thead><tbody>';
    Object.keys(byDist).sort().forEach(function (k) {
      var row = byDist[k];
      var pct = row.gradeSum / row.count;
      var letter = capForCritical(letterForPct(pct), row.nogo > 0);
      var gradeCell = row.count >= MIN_SAMPLE ? gradeHtml(letter) : '<span class="pill warn">insufficient data</span>';
      html += '<tr><td>' + esc(k) + '</td><td class="num">' + row.count + '</td><td class="num">' + gradeCell + '</td><td class="num">' + pct.toFixed(1) + '%</td><td class="num">' + row.critical + '</td><td class="num">' + row.nogo + '</td></tr>';
    });
    html += '</tbody></table></div>';
    html += '</div>';

    // monthly grading targets -- how many cars each district is supposed to get graded this
    // month, vs how many actually got graded. Targets are a manual config, not derived data.
    if (!showingSample) html += monthlyTargetsHtml(source);

    // by shift
    var byShift = {};
    source.forEach(function (d) {
      var k = d.shift || "Unassigned";
      if (!byShift[k]) byShift[k] = { count: 0, gradeSum: 0, critical: 0, nogo: 0 };
      byShift[k].count++;
      byShift[k].gradeSum += (d.gradePct !== undefined ? d.gradePct : 100);
      byShift[k].critical += (d.criticalCount || 0);
      byShift[k].nogo += (d.noGoCount || 0);
    });
    html += '<div class="card">';
    html += '<h2><span class="bar"></span>By Shift</h2>';
    html += '<p class="hint">Same grading model, cut by shift (AM 7a&ndash;3p, PM 3p&ndash;11p, Night 11p&ndash;7a) instead of district &mdash; this is what tells you if one shift is consistently behind the others, not just one yard. Shift is the shift that cleaned the car, so log it by when the cleaning happened, not when you walked it.</p>';
    html += '<div style="overflow-x:auto;"><table class="disttable"><thead><tr><th>Shift</th><th class="num">Inspections</th><th class="num">Grade</th><th class="num">Avg %</th><th class="num">Critical Areas</th><th class="num">NO-GOs</th></tr></thead><tbody>';
    Object.keys(byShift).sort().forEach(function (k) {
      var row = byShift[k];
      var pct = row.gradeSum / row.count;
      var letter = capForCritical(letterForPct(pct), row.nogo > 0);
      var gradeCell = row.count >= MIN_SAMPLE ? gradeHtml(letter) : '<span class="pill warn">insufficient data</span>';
      html += '<tr><td>' + esc(k) + '</td><td class="num">' + row.count + '</td><td class="num">' + gradeCell + '</td><td class="num">' + pct.toFixed(1) + '%</td><td class="num">' + row.critical + '</td><td class="num">' + row.nogo + '</td></tr>';
    });
    html += '</tbody></table></div>';
    html += '</div>';

    // weekly trend: average grade per week (Monday start), last 8 weeks with data. One bad week
    // is noise; look for two or three weeks moving the same direction before acting on it.
    var byWeek = {};
    source.forEach(function (d) {
      var p = String(d.date || "").split("-");
      if (p.length !== 3) return;
      var dt = new Date(+p[0], +p[1] - 1, +p[2]);
      if (isNaN(dt.getTime())) return;
      dt.setDate(dt.getDate() - ((dt.getDay() + 6) % 7));
      var wk = dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
      if (!byWeek[wk]) byWeek[wk] = { count: 0, gradeSum: 0 };
      byWeek[wk].count++;
      byWeek[wk].gradeSum += (d.gradePct !== undefined ? d.gradePct : 100);
    });
    var weekKeys = Object.keys(byWeek).sort().slice(-8);
    html += '<div class="card">';
    html += '<h2><span class="bar"></span>Weekly Trend</h2>';
    if (weekKeys.length < 2) {
      html += '<p class="hint" style="margin-bottom:0;">Needs inspections from at least two different weeks before a trend means anything.</p>';
    } else {
      html += '<p class="hint">Average grade % by week (Monday start). Weeks under ' + MIN_SAMPLE + ' inspections are shown dimmed: too few cars to trust the swing.</p>';
      html += '<div style="overflow-x:auto;"><table class="disttable"><thead><tr><th>Week of</th><th class="num">Inspections</th><th class="num">Avg %</th><th class="num">vs prior</th><th style="width:34%;"></th></tr></thead><tbody>';
      var prevAvg = null;
      weekKeys.forEach(function (wk) {
        var row = byWeek[wk];
        var avg = row.gradeSum / row.count;
        var delta = prevAvg == null ? "" : ((avg - prevAvg >= 0 ? "+" : "") + (avg - prevAvg).toFixed(1));
        var thin = row.count < MIN_SAMPLE;
        html += '<tr style="' + (thin ? "opacity:0.55;" : "") + '"><td>' + esc(wk) + '</td><td class="num">' + row.count + '</td><td class="num">' + avg.toFixed(1) + '%</td><td class="num">' + delta + '</td>' +
          '<td><div style="height:8px;background:var(--surface-2);border-radius:2px;"><div style="height:100%;width:' + Math.max(0, Math.min(100, avg)).toFixed(0) + '%;background:var(--accent);border-radius:2px;"></div></div></td></tr>';
        prevAvg = avg;
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';

    // cleaning time: planned vs actual, using the scheduled/actual minutes already captured
    // on every form -- no new data collection required.
    var timed = source.filter(function (d) { return d.scheduledMin != null && d.actualMin != null; });
    if (timed.length) {
      var avgSched = timed.reduce(function (s, d) { return s + d.scheduledMin; }, 0) / timed.length;
      var avgActual = timed.reduce(function (s, d) { return s + d.actualMin; }, 0) / timed.length;
      var overBudget = timed.filter(function (d) { return d.actualMin > d.scheduledMin; }).length;
      html += '<div class="card">';
      html += '<h2><span class="bar"></span>Cleaning Time (Planned vs. Actual)</h2>';
      html += '<p class="hint">Only counts inspections where both a scheduled and an actual time were logged (' + timed.length + ' of ' + totalInsp + ').</p>';
      html += '<div class="kpi-grid">';
      html += kpiTile(avgSched.toFixed(0) + " min", "Avg Scheduled Time");
      html += kpiTile(avgActual.toFixed(0) + " min", "Avg Actual Time");
      html += kpiTile((avgActual - avgSched >= 0 ? "+" : "") + (avgActual - avgSched).toFixed(0) + " min", "Avg Variance");
      html += kpiTile((overBudget / timed.length * 100).toFixed(0) + "%", "Ran Over Scheduled Time");
      html += '</div></div>';
    }

    // defect pareto: roll up the defect tags inspectors tap into each area's comments, so
    // "what's actually breaking" is visible without reading every comment by hand.
    var tagCounts = {};
    DEFECT_TAGS.forEach(function (t) { tagCounts[t] = 0; });
    source.forEach(function (d) {
      (d.areas || []).forEach(function (a) {
        if (a.score === null) return;
        DEFECT_TAGS.forEach(function (t) {
          // "Streaked Glass" was the earlier name for this tag; older records count toward Smudged Glass.
          var c = a.comments || "";
          if (c.indexOf(t) !== -1 || (t === "Smudged Glass" && c.indexOf("Streaked Glass") !== -1)) tagCounts[t]++;
        });
      });
    });
    var tagTotal = Object.keys(tagCounts).reduce(function (s, k) { return s + tagCounts[k]; }, 0);
    html += '<div class="card">';
    html += '<h2><span class="bar"></span>Defect Pareto</h2>';
    if (!tagTotal) {
      html += '<div class="empty">No tagged defects yet. Defect tags get counted here once inspectors start using the quick-tag chips under each area.</div>';
    } else {
      html += '<p class="hint">Counted from the defect tag chips inspectors use, across ' + totalInsp + ' inspection' + (totalInsp === 1 ? "" : "s") + '. Ranked highest to lowest so the top few causes are obvious first.</p>';
      var sortedTags = Object.keys(tagCounts).filter(function (t) { return tagCounts[t] > 0; }).sort(function (a, b) { return tagCounts[b] - tagCounts[a]; });
      var maxTag = tagCounts[sortedTags[0]];
      html += '<div style="display:flex;flex-direction:column;gap:8px;">';
      sortedTags.forEach(function (t) {
        var w = Math.round(tagCounts[t] / maxTag * 100);
        html += '<div style="display:flex;align-items:center;gap:10px;">';
        html += '<div style="width:130px;flex-shrink:0;font-family:\'IBM Plex Mono\',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.03em;color:var(--text-muted);">' + esc(t) + '</div>';
        html += '<div style="flex:1;background:var(--surface-2);border-radius:2px;height:16px;overflow:hidden;"><div style="width:' + w + '%;height:100%;background:var(--accent);"></div></div>';
        html += '<div style="width:36px;flex-shrink:0;text-align:right;font-family:\'IBM Plex Mono\',monospace;font-size:12px;">' + tagCounts[t] + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';

    // recent NO-GOs / major exceptions with photos
    var exceptions = [];
    source.forEach(function (d) {
      (d.areas || []).forEach(function (a) {
        if (a.score !== null && a.score <= 2) {
          exceptions.push({
            car: d.railcarNumber, district: d.district, date: d.date, area: a.name,
            score: a.score, action: a.exceptionAction, photos: a.exceptionPhotos || []
          });
        }
      });
    });
    html += '<div class="card">';
    html += '<h2><span class="bar" style="background:var(--bad);"></span>NO-GOs &amp; Major Exceptions</h2>';
    if (!exceptions.length) {
      html += '<div class="empty">No critical findings logged yet.</div>';
    } else {
      exceptions.slice(0, 40).forEach(function (e) {
        html += '<div class="nogo-row">';
        if (e.photos.length) {
          html += '<div class="nogo-photos">';
          e.photos.slice(0, 2).forEach(function (p) {
            if (p.sample) {
              html += '<div class="photo-thumb" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text-muted);text-align:center;">sample photo</div>';
            } else {
              html += '<a href="' + esc(p.url) + '" target="_blank" rel="noopener"><img src="' + esc(p.url) + '" alt=""></a>';
            }
          });
          html += '</div>';
        } else {
          html += '<span class="pill bad" style="flex-shrink:0;">no photo</span>';
        }
        html += '<div class="nogo-info"><div class="t">Car ' + esc(e.car) + ' &middot; ' + esc(e.district) + ' &middot; ' + esc(e.area) + ' (' + (e.score === 1 ? "NO-GO" : "score 2") + ')</div>';
        html += '<div class="s">' + esc(e.date || (showingSample ? "sample date" : "")) + ' &mdash; ' + esc(e.action || "no corrective action noted") + '</div></div>';
        html += '</div>';
      });
    }
    html += '</div>';

    document.getElementById("viewDash").innerHTML = html;
    wireDashHandlers();
  }

  function wireDashHandlers() {
    var btn = document.getElementById("toggleSampleBtn");
    if (btn) btn.addEventListener("click", function () { showingSample = !showingSample; renderDash(); });
    document.querySelectorAll("[data-target-district]").forEach(function (el) {
      el.addEventListener("change", function () {
        saveMonthlyTarget(el.getAttribute("data-target-district"), el.value);
      });
    });
  }

  function kpiTile(val, lbl) {
    return '<div class="kpi-tile"><div class="val mono">' + esc(val) + '</div><div class="lbl">' + esc(lbl) + '</div></div>';
  }

  function renderLog() {
    var html = "";
    html += '<div class="card">';
    html += '<div class="logtoolbar">';

    html += '<button class="btn-secondary" id="exportSpBtn" style="border-color:var(--accent);color:var(--accent);">Export for SharePoint</button>';
    html += '<span class="logcount">' + logDocs.length + ' submitted</span>';
    html += '</div>';
    html += '</div>';

        html += '<div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">';
        // Re-derive the letter from the stored % so older records follow the current grade scale.
        var shownLetter = doc.gradePct !== undefined ? capForCritical(letterForPct(doc.gradePct), (doc.criticalCount || 0) > 0) : doc.gradeLetter;
        if (shownLetter) html += gradeHtml(shownLetter, doc.gradePct !== undefined ? doc.gradePct.toFixed(0) + "%" : "");
        html += '<span class="pill ' + pillCls + '">' + (doc.avgScore !== null && doc.avgScore !== undefined ? doc.avgScore.toFixed(1) : "-") + '</span>';
        html += '</div>';
