        html += '<div class="logitem-detail">';
        html += detailRow("Train", doc.trainNumber);
        html += detailRow("Yard", doc.yard);
        html += detailRow("Inspection Type", doc.inspectionType);
        if (doc.jiraTicket) html += detailRow("Jira Ticket", doc.jiraTicket);
        html += detailRow("Supervisor", doc.supervisor);
        html += detailRow("Employee ID", doc.employeeId);
        html += detailRow("Scheduled / Actual (min)", (doc.scheduledMin != null ? doc.scheduledMin : "-") + " / " + (doc.actualMin != null ? doc.actualMin : "-"));
        html += detailRow("Total Score", doc.totalScore + " / " + (AREAS.length * 5));
        html += detailRow("Critical Areas (<=2)", doc.criticalCount);
        (doc.areas || []).forEach(function (a) {
          if (a.score !== null && a.score <= 2) {
            html += detailRow(a.name + " (" + (a.score === 1 ? "NO-GO" : "score 2") + ")", a.exceptionAction || "no action noted");
            if (a.exceptionPhotos && a.exceptionPhotos.length) {
              html += '<div class="photo-thumbs" style="margin:4px 0 8px;">';
              a.exceptionPhotos.forEach(function (p) {
                html += '<a href="' + esc(p.url) + '" target="_blank" rel="noopener"><div class="photo-thumb"><img src="' + esc(p.url) + '" alt=""></div></a>';
              });
              html += '</div>';
            }
          }
        });
        html += detailRow("Certified By", doc.certifiedName + " on " + doc.certifiedDate);
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';
    }
    document.getElementById("viewLog").innerHTML = html;

    document.querySelectorAll(".logitem").forEach(function (el) {
      el.addEventListener("click", function () { el.classList.toggle("open"); });
    });
    var exportBtn = document.getElementById("exportCsvBtn");
    if (exportBtn) exportBtn.addEventListener("click", exportCsv);
    var exportCaBtn = document.getElementById("exportCaCsvBtn");
    if (exportCaBtn) exportCaBtn.addEventListener("click", exportCaCsv);
    var exportSpBtn = document.getElementById("exportSpBtn");
    if (exportSpBtn) exportSpBtn.addEventListener("click", exportSharePointJson);
  }

  function detailRow(label, value) {
    return '<div class="detail-row"><span>' + esc(label) + '</span><span class="mono">' + esc(value == null || value === "" ? "-" : value) + '</span></div>';
  }

  function csvEscape(v) {
    var s = String(v == null ? "" : v);
    if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  // ---- Full-database reads: page through a collection 1,000 at a time (the most one query
  // returns), so exports and the storage meter see every record, not just the loaded window. ----
  function fetchAll(coll, field) {
    var out = [];
    function page(after) {
      var q = db.collection(coll).orderBy(field, "asc");
      if (after !== undefined) q = q.where(field, ">", after);
      return q.limit(1000).get().then(function (snap) {
        var docs = snap.docs.map(function (d) { return Object.assign({ _id: d.id }, d.data()); });
        out = out.concat(docs);
        var last = docs.length ? docs[docs.length - 1][field] : undefined;
        if (docs.length === 1000 && last !== undefined) return page(last);
        return out;
      });
    }
    return page();
  }

  // ---- Storage meter: the page's database holds 5,000 records total (inspections + corrective
  // actions + settings). Counted on demand, not on every render. ----
  var STORAGE_CAP = 5000;
  var storage = { count: null, inspections: 0, cas: 0, checkedAt: 0, loading: false, error: false };
  function refreshStorage(force) {
    if (!db || storage.loading) return;
    if (!force && storage.checkedAt && (Date.now() - storage.checkedAt) < 5 * 60 * 1000) return;
    storage.loading = true;
    Promise.all([fetchAll("inspections", "submittedAt"), fetchAll("correctiveActions", "createdAt")]).then(function (r) {
      storage.inspections = r[0].length; storage.cas = r[1].length;
      storage.count = r[0].length + r[1].length + 1; // +1 for the monthly-targets settings record
      storage.checkedAt = Date.now(); storage.error = false;
    }).catch(function () { storage.error = true; }).then(function () {
      storage.loading = false;
      if (currentTab === "dash") renderDash();
    });
  }
  function storageMeterHtml() {
    var out = '<div class="card"><h2><span class="bar"></span>Storage</h2>';
    if (storage.count === null) {
      out += '<p class="hint" style="margin:0;">' + (storage.error ? "Couldn't count records right now." : "Counting records&hellip;") + '</p></div>';
      return out;
    }
    var pct = Math.min(100, storage.count / STORAGE_CAP * 100);
    var color = pct >= 85 ? "var(--bad)" : (pct >= 60 ? "var(--warn)" : "var(--good)");
    out += '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;">';
    out += '<div class="mono" style="font-size:20px;font-weight:700;">' + storage.count.toLocaleString() + ' <span style="font-size:12px;color:var(--text-muted);">of ' + STORAGE_CAP.toLocaleString() + ' records</span></div>';
    out += '<div class="mono" style="font-size:11px;color:var(--text-muted);">' + storage.inspections + ' inspections &middot; ' + storage.cas + ' corrective actions</div></div>';
    out += '<div class="progress-track" style="height:10px;margin:10px 0 8px;"><div class="progress-fill" style="width:' + pct.toFixed(1) + '%;background:' + color + ';"></div></div>';
    out += '<p class="hint" style="margin:0;">' + (pct >= 85
      ? '<strong style="color:var(--bad);">Near capacity.</strong> Export both CSVs to SharePoint and roll up older months now; new inspections will be refused when the database is full.'
      : pct >= 60
        ? '<strong style="color:var(--warn);">Plan a rollup.</strong> Export to SharePoint and condense older months before this reaches 85%.'
        : 'Plenty of room. Keep exporting to SharePoint weekly so it stays the permanent record.') + '</p>';
    return out + '</div>';
  }

  // ---- SharePoint-ready exports: stable column names that match the SharePoint list schema,
  // one row per record, a unique ID per row so the Power Automate import can update instead of
  // duplicating when the same file (or an overlapping export) is imported twice. ----
  function areaCol(name) { return "Score_" + name.replace(/[^A-Za-z0-9]+/g, ""); }
  function saveCsv(filename, header, rows) {
    var lines = [header.join(",")].concat(rows.map(function (r) { return r.map(csvEscape).join(","); }));
    if (!downloadsCap) { setStatus("Downloads aren't available in this view.", "err"); return Promise.resolve(); }
    return downloadsCap.save({ filename: filename, data: lines.join("\n") }).catch(function () {});
  }
  function exportCsv() {
    if (!db) { setStatus("Live storage isn't available in this view right now.", "err"); return; }
    setStatus("Preparing inspection export…");
    fetchAll("inspections", "submittedAt").then(function (docs) {
      var t = inspectionTable(docs);
      return saveCsv("metra-qc-inspections-" + todayStr() + ".csv", t.header, t.rows).then(function () {
        setStatus("Exported " + t.rows.length + " inspections.", "ok");
      });
    }).catch(function () { setStatus("Export failed. Try again.", "err"); });
  }
  function inspectionTable(docs) {
    {
      var header = ["InspectionID", "InspectionDate", "SubmittedAt", "District", "Yard", "TrainNumber", "CarNumber", "Shift",
        "CleaningStage", "InspectionType", "JiraTicket", "Inspector", "Supervisor", "EmployeeID", "ScheduledMin", "ActualMin",
        "GradePct", "GradeLetter", "AvgAreaScore", "CriticalAreas", "NoGoAreas", "PhotoCount"]
        .concat(AREAS.map(areaCol)).concat(["DefectNotes", "CertifiedBy", "CertifiedDate"]);
      var rows = docs.map(function (d) {
        var areas = d.areas || [];
        var byName = {}; areas.forEach(function (a) { byName[a.name] = a; });
        var photos = areas.reduce(function (n, a) { return n + ((a.exceptionPhotos || []).length); }, 0);
        var notes = areas.filter(function (a) { return a.comments || a.exceptionAction; }).map(function (a) {
          return a.name + ": " + [a.comments, a.exceptionAction].filter(Boolean).join(" / ");
        }).join(" | ");
        var letter = d.gradePct !== undefined ? capForCritical(letterForPct(d.gradePct), (d.criticalCount || 0) > 0) : (d.gradeLetter || "");
        return [d._id, d.date, d.submittedAt, d.district, d.yard, d.trainNumber, d.railcarNumber, d.shift,
          isBaseline(d) ? "Before" : "After", d.inspectionType, d.jiraTicket, d.inspectorName, d.supervisor, d.employeeId,
          d.scheduledMin, d.actualMin, d.gradePct, letter, d.avgScore != null ? Number(d.avgScore).toFixed(2) : "",
          d.criticalCount, d.noGoCount, photos]
          .concat(AREAS.map(function (n) { return byName[n] && byName[n].score != null ? byName[n].score : ""; }))
          .concat([notes, d.certifiedName, d.certifiedDate]);
      });
      return { header: header, rows: rows };
    }
  }
  function exportCaCsv() {
    if (!db) { setStatus("Live storage isn't available in this view right now.", "err"); return; }
    setStatus("Preparing corrective action export…");
    fetchAll("correctiveActions", "createdAt").then(function (docs) {
      var t = caTable(docs);
      return saveCsv("metra-qc-corrective-actions-" + todayStr() + ".csv", t.header, t.rows).then(function () {
        setStatus("Exported " + t.rows.length + " corrective actions.", "ok");
      });
    }).catch(function () { setStatus("Export failed. Try again.", "err"); });
  }
  function caTable(docs) {
    {
      var header = ["CorrectiveActionID", "SourceInspectionID", "CarNumber", "District", "Area", "Severity", "DefectDescription",
        "CorrectiveAction", "ProbableCause", "ConfirmedRootCause", "Owner", "AssignedDate", "DueDate", "Status", "CompletionDate",
        "ReinspectionID", "ReinspectionResult", "EffectivenessVerified", "VerifiedDate", "Notes"];
      var rows = docs.map(function (c) {
        return [c._id, c.sourceInspectionId, c.railcarNumber, c.district, c.area, c.severity, c.defectDescription,
          c.correctiveActionText, c.probableCause, c.confirmedRootCause, c.owner, c.assignedDate, c.dueDate, c.status,
          c.completionDate, c.reinspectionId, c.reinspectionResult, c.effectivenessVerified ? "Yes" : "No", c.verifiedDate, c.notes];
      });
      return { header: header, rows: rows };
    }
  }
  // One JSON file with both tables, for the Power Automate import. JSON parses natively in
  // Power Automate (Parse JSON), so notes with commas or line breaks can't break the import.
  function exportSharePointJson() {
    if (!db) { setStatus("Live storage isn't available in this view right now.", "err"); return; }
    if (!downloadsCap) { setStatus("Downloads aren't available in this view.", "err"); return; }
    setStatus("Preparing SharePoint export…");
    Promise.all([fetchAll("inspections", "submittedAt"), fetchAll("correctiveActions", "createdAt")]).then(function (r) {
      var toObjects = function (t) {
        return t.rows.map(function (row) {
          var o = {};
          t.header.forEach(function (h, i) { var v = row[i]; o[h] = (v === undefined || v === null) ? "" : String(v); });
          return o;
        });
      };
      var payload = { exportedAt: new Date().toISOString(), inspections: toObjects(inspectionTable(r[0])), correctiveActions: toObjects(caTable(r[1])) };
      return downloadsCap.save({ filename: "metra-qc-sharepoint-" + todayStr() + ".json", data: JSON.stringify(payload) }).then(function () {
        setStatus("SharePoint export ready: " + payload.inspections.length + " inspections, " + payload.correctiveActions.length + " corrective actions.", "ok");
      });
    }).catch(function () { setStatus("Export failed. Try again.", "err"); });
  }

  function renderFull() {
    var view = document.getElementById("viewFull");

    view.setAttribute("data-loaded", "1");

  // ---- Feed real data into the embedded Full Dashboard, and take its edits back ----
  function pushFullData() {
    var frame = document.querySelector(".fullframe");
    if (!frame || !frame.contentWindow) return;
    try {
      frame.contentWindow.postMessage({
        type: "qc-data",
        connected: !!db && sourceState.log === "ok",
        inspections: JSON.parse(JSON.stringify(graded(logDocs))),
        baselineCount: (logDocs || []).filter(isBaseline).length,
        actions: JSON.parse(JSON.stringify(caDocs || []))
      }, window.location.origin);
    } catch (e) {}
  }
  window.addEventListener("message", function (e) {
    if (e.origin !== window.location.origin || !e.data) return;
    if (e.data.type === "qc-ready") pushFullData();
    if (e.data.type === "qc-open-new") setTab("new");
    if (e.data.type === "qc-ca-status" && e.data.id) {
      var ca = caDocs.find(function (c) { return c._id === e.data.id; });
      if (!ca) return;
      var patch;
      if (e.data.status === "Closed") patch = { status: "Completed", completionDate: todayStr() };
      else if (e.data.status === "In Progress") patch = { status: "In Progress", completionDate: "" };
      else patch = { status: "Open", completionDate: "", effectivenessVerified: false, verifiedDate: "" };
      updateCA(ca._id, patch);
    }
  });

  // ---- Yard Board: trains coming in, layover countdowns, alert banner ----
  // Source of truth is what you enter (or paste) here: Metra's public feed knows positions and
  // delays, not yard layover or departure plans. When the live snapshot is running, a matching
  // train number also shows its live delay. Stored in this browser only, so no database change.
  var BOARD_KEY = "qcYardBoardV1";
  var board = { items: [], warn: 10, lead: 15, scroll: true, sound: false, watch: {}, sheet: "auto", loc: "OTC", sel: 0, tickOn: true, tickYard: "All" };
  var tickerMap = {}, tickerSig = "";
  var boardSig = "", boardAlertKeys = {}, boardPauseUntil = 0, boardAudio = null;
  function boardLoad() {
    try {
      var raw = localStorage.getItem(BOARD_KEY);
      if (raw) { var o = JSON.parse(raw); if (o && o.items) board = Object.assign(board, o); }
    } catch (e) {}
    var cut = Date.now() - 36 * 3600 * 1000;
    board.items = board.items.filter(function (x) { return (x.created || 0) > cut; });
  }
  function boardSave() { try { localStorage.setItem(BOARD_KEY, JSON.stringify(board)); } catch (e) {} }
  function boardTime(hhmm, ref) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || "").trim());
    if (!m) return null;
    var best = null;
    for (var k = -1; k <= 1; k++) {
      var d = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate() + k, +m[1], +m[2], 0);
      if (best === null || Math.abs(d - ref) < Math.abs(best - ref)) best = d;
    }
    return best;
  }
  function boardDep(it) {
    var base = it.arrivedAt ? new Date(it.arrivedAt) : boardTime(it.arr, new Date());
    if (!base || !it.dep) return null;
    var m = /^(\d{1,2}):(\d{2})$/.exec(it.dep);
    if (!m) return null;
    var d = new Date(base.getFullYear(), base.getMonth(), base.getDate(), +m[1], +m[2], 0);
    if (d < base - 30 * 60000) d = new Date(d.getTime() + 86400000);
    return d;
  }
  function boardFmt(ms) {
    var neg = ms < 0, s = Math.floor(Math.abs(ms) / 1000);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return (neg ? "+" : "") + (h ? h + ":" + p(m) : m) + ":" + p(sec);
  }
  // One computed row per train: status text, level (good/warn/bad/idle) and the number to show.
  function boardModel(it, now) {
    var live = (typeof findLiveTrain === "function") ? findLiveTrain(it.train) : null;
    var delay = live && live.delay_min != null ? live.delay_min : (it.delay || 0);
    var r = { it: it, live: !!live, level: "idle", stat: "Scheduled", cd: "", cdLevel: "", key: "", alert: "", pct: 0, sort: 0 };
    if (it.arrivedAt) {
      var arrivedAt = new Date(it.arrivedAt), dep = boardDep(it);
      r.stat = "Arrived";
      if (dep) {
        var rem = dep - now, total = Math.max(1, dep - arrivedAt);
        r.cd = boardFmt(rem); r.sort = rem; r.pct = Math.max(0, Math.min(100, rem / total * 100));
        r.level = (rem <= 3 * 60000) ? "bad" : (rem <= board.warn * 60000 ? "warn" : "good");
        r.cdLevel = r.level;
        if (r.level !== "good") {
          r.key = it.id + ":lay:" + r.level;
          r.alert = "Train " + it.train + " layover " + (rem < 0 ? "OVER " + boardFmt(-rem).replace("+", "") : boardFmt(rem) + " left") + (it.loc ? " @ " + it.loc : "");
        }
      } else { r.cd = "no dep"; r.sort = 9e12; }
      return r;
    }
    var sched = boardTime(it.arr, now);
    if (!sched) { r.sort = 9e12 + 1; return r; }
    var exp = new Date(sched.getTime() + delay * 60000), toArr = exp - now;
    r.sort = toArr + 1e11;
    r.stat = delay >= 5 ? "Delayed +" + delay : (live ? "On time" : "Scheduled");
    r.cd = toArr > 0 ? boardFmt(toArr) : "due";
    if (toArr <= 3 * 60000 && toArr > -10 * 60000) r.level = "bad";
    else if (toArr <= board.lead * 60000 && toArr > -10 * 60000) r.level = "warn";
    r.cdLevel = r.level === "idle" ? "" : r.level;
    if (r.level !== "idle") {
      r.key = it.id + ":arr:" + r.level;
      r.alert = "Train " + it.train + (toArr > 0 ? " arriving in " + Math.max(1, Math.ceil(toArr / 60000)) + " min" : " ARRIVING NOW") + (it.loc ? " @ " + it.loc : "");
    }
    return r;
  }
  function boardBeep() {
    if (!board.sound) return;
    try {
      boardAudio = boardAudio || new (window.AudioContext || window.webkitAudioContext)();
      var o = boardAudio.createOscillator(), g = boardAudio.createGain();
      o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(boardAudio.destination);
      o.start(); o.stop(boardAudio.currentTime + 0.25);
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate(200); } catch (e) {}
  }
  function boardRowHtml(r) {
    var it = r.it, h = '<div class="bd-row ' + r.level + '" data-bd="' + esc(it.id) + '">';
    h += '<div class="bd-top"><div><span class="bd-train">' + esc(it.train) + '</span><span class="bd-dist">' + esc(it.route || "") + '</span></div>';
    h += '<span class="pill ' + (r.stat === "Arrived" ? "good" : (/Delayed/.test(r.stat) ? "bad" : "warn")) + '">' + esc(r.stat) + (r.live ? " &middot; live" : "") + '</span>';
    h += '<div class="bd-cd ' + r.cdLevel + '" data-cd="' + esc(it.id) + '">' + esc(r.cd) + '</div></div>';
    h += '<div class="bd-meta"><span>Arr ' + esc(it.arr || "--:--") + '</span><span>Dep ' + esc(it.dep || "--:--") + '</span><span>' + (it.loc ? esc(it.loc) : "Track n/a") + '</span>' +
      (it.arrivedAt ? '<span>In ' + esc(new Date(it.arrivedAt).toTimeString().slice(0, 5)) + '</span>' : '') + '</div>';
    if (it.arrivedAt) h += '<div class="bd-bar"><div data-bar="' + esc(it.id) + '" style="width:' + r.pct.toFixed(0) + '%"></div></div>';
    h += '<div class="bd-acts">';
    if (!it.arrivedAt) h += '<button type="button" class="btn-secondary" data-bd-act="arrived" data-id="' + esc(it.id) + '">Arrived</button>';
    h += '<button type="button" class="btn-secondary" data-bd-act="inspect" data-id="' + esc(it.id) + '">Inspect</button>';
    h += '<button type="button" class="btn-secondary" data-bd-act="done" data-id="' + esc(it.id) + '">' + (it.arrivedAt ? "Departed" : "Remove") + '</button>';
    return h + '</div></div>';
  }
  function renderBoardList(models) {
    var el = document.getElementById("boardList");
    if (!el) return;
    var top = el.scrollTop;
    if (!models.length) { el.innerHTML = '<div class="empty">No trains on the board. Add one above or paste a schedule.</div>'; return; }
    var inYard = models.filter(function (r) { return r.it.arrivedAt; }), coming = models.filter(function (r) { return !r.it.arrivedAt; });
    var h = "";
    if (inYard.length) h += '<div class="bd-sec">In the yard (' + inYard.length + ')</div>' + inYard.map(boardRowHtml).join("");
    if (coming.length) h += '<div class="bd-sec">Coming in (' + coming.length + ')</div>' + coming.map(boardRowHtml).join("");
    el.innerHTML = h; el.scrollTop = top;
  }

    if (/hvac|heat|air condition|equipment|door|seat|window|light|brake|engine|loco|pa system|speaker/.test(s)) return "Mechanical";
    if (/crowd|late|delay|schedule|cars? to|capacity/.test(s)) return "Operations";
    return "Other";
  }
  function cmpDays(d) {
    if (!d.date) return 0;
    var a = new Date(d.date + "T00:00:00"), b = d.closedDate ? new Date(d.closedDate + "T00:00:00") : new Date();
    return Math.max(0, Math.floor((b - a) / 86400000));
  }
  function cmpIsOpen(d) { return d.status !== "Closed" && d.status !== "Referred"; }
  function cmpRepeat(d) {
    var n = 0;
    cmpDocs.forEach(function (o) {
      if (o.ticket === d.ticket || o.district !== d.district || o.category !== d.category || !d.district) return;
      var gap = Math.abs((new Date(o.date + "T00:00:00") - new Date(d.date + "T00:00:00")) / 86400000);
      if (gap <= 30) n++;
    });
    return n;
  }
  function cmpMake(r) {
    return { ticket: r.ticket, date: r.date, line: r.line, category: r.category, queue: r.queue || "", description: r.text,
      district: cmpDistrict(r.line), type: cmpType(r.category, r.text), status: "New", train: "", car: "", notes: "", referredTo: "", closedDate: "", createdAt: new Date().toISOString() };
  }
  function cmpFinal(rec) {
    if (rec.type !== "Cleaning") { rec.status = "Referred"; rec.referredTo = rec.type === "Mechanical" ? "Mechanical" : (rec.type === "Operations" ? "Operations / Planning" : ""); }
    return rec;
  }
  function subscribeComplaints() {
    if (!db || cmpUnsub) return;
    cmpUnsub = db.collection("complaints").limit(1000).onSnapshot(function (snap) {
      cmpErr = false;
      cmpDocs = snap.docs.map(function (d) { return Object.assign({ _id: d.id }, d.data()); });
      cmpDocs.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)) || String(b.ticket).localeCompare(String(a.ticket)); });
      cmpBadge();
      if (currentTab === "complaints") renderComplaints();
    }, function () { cmpErr = true; if (currentTab === "complaints") renderComplaints(); });
  }
  function cmpBadge() {
    var el = document.getElementById("cmpBadge"); if (!el) return;
    var n = cmpDocs.filter(function (d) { return d.type === "Cleaning" && cmpIsOpen(d); }).length;
    el.textContent = n; el.hidden = !n;
  }
  function cmpSave(rec) {
    if (!db) { setStatus("Not connected to the database.", "err"); return Promise.resolve(); }
    return db.collection("complaints").doc("T" + rec.ticket).set(rec).catch(function () { setStatus("Couldn't save complaint " + rec.ticket + ".", "err"); });
  }
  function cmpUpdate(id, patch) {
    if (!db) return;
    patch.updatedAt = new Date().toISOString();
    db.collection("complaints").doc(id).update(patch).catch(function () { setStatus("Couldn't update the complaint.", "err"); });
  }
  // Best-effort parser for text pasted from the report. Review the preview before saving.
  function cmpParse(text) {
    var out = [], parts = String(text || "").replace(/\r/g, "").split(/\n(?=\s*\d{5}\s)/);
    parts.forEach(function (p) {
      var m = p.match(/^\s*(\d{5})\s+([\s\S]*)$/); if (!m) return;
      var dm = m[2].match(/(\d{4}-\d{2}-\d{2}),\s*([^,\n]+),\s*([^\n]+?)(?:\s{2,}|\n|$)/); if (!dm) return;
      var queue = m[2].slice(0, m[2].indexOf(dm[0])).replace(/\s+/g, " ").trim();
      var rest = m[2].slice(m[2].indexOf(dm[0]) + dm[0].length).replace(/\b(NEW|OPEN|CLOSED|IN PROGRESS)\b/g, " ").replace(/\d{1,2}\/\d{1,2}\/\d{2,4}\s+\d{1,2}:\d{2}\s*[AP]M[\s\S]*$/i, "").replace(/\d+\s*\/\s*\d+\s*$/, "").replace(/\s+/g, " ").trim();
      out.push({ ticket: m[1], date: dm[1], line: dm[2].trim(), category: dm[3].trim(), queue: queue, text: rest });
    });
    return out;
  }
  function renderComplaints() {
    var host = document.getElementById("viewComplaints"); if (!host) return;
    var h = "", today = todayStr();
    var cl = cmpDocs.filter(function (d) { return d.type === "Cleaning"; });
    var openCl = cl.filter(cmpIsOpen);
    var rep = cmpDocs.filter(function (d) { return cmpRepeat(d) > 0; }).length;
    var avgOpen = openCl.length ? Math.round(openCl.reduce(function (s, d) { return s + cmpDays(d); }, 0) / openCl.length) : 0;
    h += '<div class="card"><div class="kpi-grid">';
    h += kpiTile(cmpDocs.length, "Tickets");
    h += kpiTile(cl.length ? cl.length + " (" + Math.round(cl.length / cmpDocs.length * 100) + "%)" : "0", "Cleaning related");
    h += kpiTile(openCl.length, "Cleaning open");
    h += kpiTile(openCl.length ? avgOpen + "d" : "-", "Avg days open");
    h += '</div>';
    h += '<p class="hint" style="margin:8px 0 0;">Only Cleaning tickets count toward cleaning metrics. Mechanical, Operations and Other tickets are logged as referred so the queue is accounted for.' + (rep ? ' ' + rep + ' ticket' + (rep === 1 ? '' : 's') + ' repeat a category on the same district within 30 days.' : '') + '</p></div>';
    if (cmpErr) h += '<div class="card"><div class="empty">Couldn\'t load complaints. Check the connection, or add the complaints collection to the database rules.</div></div>';
    if (!cmpDocs.length && !cmpErr) {
      h += '<div class="card"><div class="empty">No complaints logged yet.</div><button type="button" class="btn-secondary" data-cm-act="seed" style="margin-top:8px;width:100%;">Load the 6 tickets from the 10/07/26 report</button></div>';
    }
    h += '<div class="card"><div class="chiprow">';
    [["all", "All"], ["cleaning", "Cleaning"], ["open", "Open"], ["referred", "Referred"]].forEach(function (f) {
      h += '<button type="button" class="chip' + (cmpFilter === f[0] ? " on" : "") + '" data-cm-filter="' + f[0] + '"' + (cmpFilter === f[0] ? ' style="border-color:var(--accent);color:var(--accent);"' : '') + '>' + f[1] + '</button>';
    });
    h += '</div></div>';
    var list = cmpDocs.filter(function (d) {
      return cmpFilter === "all" || (cmpFilter === "cleaning" && d.type === "Cleaning") || (cmpFilter === "open" && cmpIsOpen(d)) || (cmpFilter === "referred" && d.status === "Referred");
    });
    if (list.length) h += '<div class="card">';
    list.forEach(function (d) {
      var days = cmpDays(d), r = cmpRepeat(d), id = esc(d._id);
      var cls = d.status === "Closed" ? "good" : (d.type === "Cleaning" && cmpIsOpen(d) ? (days >= 3 ? "bad" : "warn") : "good");
      h += '<div class="logitem" style="cursor:default;"><div class="logitem-top"><div><div class="logitem-title">#' + esc(d.ticket) + ' &middot; ' + esc(d.category) + '</div>';
      h += '<div class="logitem-sub">' + esc(d.district || "district?") + ' &middot; ' + esc(d.line) + ' &middot; ' + esc(d.date) + ' &middot; ' + days + 'd' + (r ? ' &middot; repeat x' + (r + 1) : '') + '</div></div>';
      h += '<span class="pill ' + cls + '">' + esc(d.status) + '</span></div>';
      h += '<div style="margin-top:8px;font-size:12.5px;color:var(--text-muted);">' + esc(d.description) + '</div>';
      h += '<div class="grid3" style="margin-top:10px;">';
      h += '<div class="field"><label>Type</label><select data-cm-f="type" data-cm-id="' + id + '">' + CMP_TYPES.map(function (t) { return '<option' + (t === d.type ? ' selected' : '') + '>' + t + '</option>'; }).join("") + '</select></div>';
      h += '<div class="field"><label>Status</label><select data-cm-f="status" data-cm-id="' + id + '">' + CMP_STATUSES.map(function (t) { return '<option' + (t === d.status ? ' selected' : '') + '>' + t + '</option>'; }).join("") + '</select></div>';
      h += '<div class="field"><label>District</label><select data-cm-f="district" data-cm-id="' + id + '"><option value=""></option>' + DISTRICTS.map(function (t) { return '<option' + (t === d.district ? ' selected' : '') + '>' + t + '</option>'; }).join("") + '</select></div>';
      h += '</div><div class="grid3" style="margin-top:8px;">';
      h += '<div class="field"><label>Train #</label><input type="text" data-cm-f="train" data-cm-id="' + id + '" value="' + esc(d.train || "") + '" placeholder="from customer or CS"></div>';
      h += '<div class="field"><label>Car #</label><input type="text" data-cm-f="car" data-cm-id="' + id + '" value="' + esc(d.car || "") + '"></div>';
      h += '<div class="field"><label>Notes</label><input type="text" data-cm-f="notes" data-cm-id="' + id + '" value="' + esc(d.notes || "") + '"></div>';
      h += '</div>';
      if (d.type === "Cleaning" && d.status !== "Closed") h += '<button type="button" class="btn-secondary" data-cm-act="inspect" data-cm-id="' + id + '" style="margin-top:8px;border-color:var(--accent);color:var(--accent);">Open complaint-driven inspection</button>';
      h += '</div>';
    });
    if (list.length) h += '</div>';
    h += '<div class="card"><h2 style="margin-top:0;"><span class="bar"></span>Add tickets</h2><p class="hint" style="margin:0 0 8px;">Paste text copied from the Customer Complaints report. Tickets already logged are updated, not duplicated.</p>';
    h += '<textarea id="cmPaste" rows="5" style="width:100%;" placeholder="59931 Milwaukee ... 2026-09-30, North Central Service, HVAC Issue ...">' + esc(cmpPaste) + '</textarea>';
    h += '<button type="button" class="btn-secondary" data-cm-act="parse" style="margin-top:8px;width:100%;">Read pasted report</button>';
    if (cmpPreview) {
      h += '<p class="hint" style="margin:8px 0;">' + (cmpPreview.length ? 'Found ' + cmpPreview.length + ' ticket' + (cmpPreview.length === 1 ? '' : 's') + ': ' + cmpPreview.map(function (r) { return '#' + esc(r.ticket) + ' ' + esc(r.category) + ' (' + cmpType(r.category, r.text) + ')'; }).join(', ') + '.' : 'No tickets found. Check that the ticket numbers and dates (yyyy-mm-dd, line, category) came through.') + '</p>';
      if (cmpPreview.length) h += '<button type="button" class="btn-secondary" data-cm-act="savepaste" style="width:100%;border-color:var(--accent);color:var(--accent);">Save ' + cmpPreview.length + ' to the log</button>';
    }
    h += '</div>';
    host.innerHTML = h;
  }
  (function wireComplaints() {
    var host = document.getElementById("viewComplaints"); if (!host) return;
    host.addEventListener("click", function (e) {
      var f = e.target.closest("[data-cm-filter]"); if (f) { cmpFilter = f.getAttribute("data-cm-filter"); renderComplaints(); return; }
      var b = e.target.closest("[data-cm-act]"); if (!b) return;
      var act = b.getAttribute("data-cm-act");
      if (act === "seed") { Promise.all(CMP_SEED.map(function (r) { return cmpSave(cmpFinal(cmpMake(r))); })).then(function () { setStatus("Loaded " + CMP_SEED.length + " tickets.", "ok"); }); return; }
      if (act === "parse") { var ta = document.getElementById("cmPaste"); cmpPaste = ta ? ta.value : ""; cmpPreview = cmpParse(cmpPaste); renderComplaints(); return; }
      if (act === "savepaste") { var rows = cmpPreview || []; Promise.all(rows.map(function (r) {
        var ex = cmpDocs.filter(function (d) { return d.ticket === r.ticket; })[0];
        if (ex) return Promise.resolve();
        return cmpSave(cmpFinal(cmpMake(r)));
      })).then(function () { setStatus("Saved " + rows.length + " ticket(s).", "ok"); cmpPreview = null; cmpPaste = ""; renderComplaints(); }); return; }
      if (act === "inspect") {
        var d = cmpDocs.filter(function (x) { return x._id === b.getAttribute("data-cm-id"); })[0]; if (!d) return;
        boardInspect(d.train || "", d.district || "", "");
        state.inspectionType = "Complaint-Driven"; state.jiraTicket = d.ticket;
        if (d.car) state.railcarNumber = d.car;
        renderNew();
        if (d.status === "New") cmpUpdate(d._id, { status: "Inspection opened" });
      }
    });
    host.addEventListener("change", function (e) {
      var el = e.target.closest("[data-cm-f]"); if (!el) return;
      var id = el.getAttribute("data-cm-id"), fld = el.getAttribute("data-cm-f"), patch = {}; patch[fld] = el.value;
      if (fld === "status") patch.closedDate = el.value === "Closed" ? todayStr() : "";
      if (fld === "type" && el.value !== "Cleaning") { patch.status = "Referred"; patch.referredTo = el.value === "Mechanical" ? "Mechanical" : (el.value === "Operations" ? "Operations / Planning" : ""); }
      if (fld === "type" && el.value === "Cleaning") { patch.status = "New"; patch.referredTo = ""; }
      cmpUpdate(id, patch);
    });
    var t = setInterval(function () { if (db) { clearInterval(t); subscribeComplaints(); } }, 800);
  })();
  // ---- tabs ----
  function setTab(tab) {
    currentTab = tab;
    document.getElementById("tabBtnNew").classList.toggle("active", tab === "new");
    document.getElementById("tabBtnLog").classList.toggle("active", tab === "log");
    document.getElementById("tabBtnCA").classList.toggle("active", tab === "ca");
    document.getElementById("tabBtnDash").classList.toggle("active", tab === "dash");
    document.getElementById("viewNew").style.display = tab === "new" ? "" : "none";
    document.getElementById("viewLog").style.display = tab === "log" ? "" : "none";
    document.getElementById("viewCA").style.display = tab === "ca" ? "" : "none";
    document.getElementById("viewDash").style.display = tab === "dash" ? "" : "none";
    document.getElementById("tabBtnFull").classList.toggle("active", tab === "full");
    document.getElementById("tabBtnBoard").classList.toggle("active", tab === "board");
    document.getElementById("viewBoard").style.display = tab === "board" ? "" : "none";
    if (tab === "board") renderBoard();
    document.getElementById("tabBtnComplaints").classList.toggle("active", tab === "complaints");
    document.getElementById("viewComplaints").style.display = tab === "complaints" ? "" : "none";
    if (tab === "complaints") { subscribeComplaints(); renderComplaints(); }
    document.getElementById("viewFull").style.display = tab === "full" ? "" : "none";
    document.querySelector(".infobar").style.display = tab === "full" ? "none" : "";
    document.querySelector(".wrap").style.maxWidth = tab === "full" ? "1200px" : "";
    if (tab === "full") { subscribeLog(); subscribeCA(); renderFull(); pushFullData(); }
    document.getElementById("submitBar").style.display = (tab === "new" && !needsSetup()) ? "" : "none";
    if (tab === "log") { subscribeLog(); renderLog(); }
    if (tab === "ca") { subscribeCA(); renderCA(); }
    if (tab === "dash") { subscribeLog(); subscribeCA(); subscribeTargets(); renderDash(); }
  }
  document.getElementById("tabBtnNew").addEventListener("click", function () { setTab("new"); });
  document.getElementById("tabBtnLog").addEventListener("click", function () { setTab("log"); });
  document.getElementById("tabBtnCA").addEventListener("click", function () { setTab("ca"); });
  document.getElementById("tabBtnDash").addEventListener("click", function () { setTab("dash"); });
  document.getElementById("tabBtnFull").addEventListener("click", function () { setTab("full"); });
  document.getElementById("tabBtnBoard").addEventListener("click", function () { setTab("board"); });
  document.getElementById("tabBtnComplaints").addEventListener("click", function () { setTab("complaints"); });
  document.getElementById("submitBtn").addEventListener("click", submit);

  applyDisplayMode(loadDisplayMode());
  document.getElementById("modeToggleBtn").addEventListener("click", function () {
    var next = loadDisplayMode() === "daylight" ? "tactical" : "daylight";
    saveDisplayMode(next);
    applyDisplayMode(next);
  });

  var beaconBtnEl = document.getElementById("beaconBtn");
  var beaconPanelEl = document.getElementById("beaconPanel");
  beaconBtnEl.addEventListener("click", function (e) {
    e.stopPropagation();
    var open = beaconPanelEl.classList.toggle("open");
    beaconBtnEl.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.addEventListener("click", function () { beaconPanelEl.classList.remove("open"); beaconBtnEl.setAttribute("aria-expanded", "false"); });
  renderBeacon();

  outboxLoad(); syncBadge();
  var restored = false, dr = draftLoad();
  if (dr && ((dr.railcarNumber || "").trim() || (dr.areas || []).some(function (a) { return a && a.score !== null; }))) {
    try { state = Object.assign(freshState(), dr); restored = true; } catch (e) {}
  }

  // ---- keep the connection alive: reconnect, resubscribe, resend ----
  function reconnect() {
    if (!db) { if (!needsSetup()) initFirebase(); }
    ["log", "ca", "targets"].forEach(function (k) {
      if (sourceState[k] !== "bad") return;
      try { if (k === "log" && logUnsub) logUnsub(); if (k === "ca" && caUnsub) caUnsub(); if (k === "targets" && targetsUnsub) targetsUnsub(); } catch (e) {}
      if (k === "log") { logUnsub = null; subscribeLog(); }
      if (k === "ca") { caUnsub = null; subscribeCA(); }
      if (k === "targets") { targetsUnsub = null; subscribeTargets(); }
    });
  }
  setInterval(function () { reconnect(); flushOutbox(); }, 20000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") { reconnect(); flushOutbox(); } });
  setInterval(draftSave, 3000);
  window.addEventListener("pagehide", draftSave);
  window.addEventListener("beforeunload", function (e) { if (outbox.length) { e.preventDefault(); e.returnValue = ""; } });

  // ---- Brand: types the name out on load, like a terminal ----
  (function () {
    var t = document.getElementById("brandTxt"), s = document.getElementById("brandSub");
    var c1 = document.getElementById("brandCaret"), c2 = document.getElementById("brandCaret2");
    if (!t || !s) return;
    var full = t.textContent, sub = s.textContent;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    t.textContent = ""; s.textContent = ""; c2.className = "caret sm off";
    var i = 0, j = 0;
    function typeSub() {
      c1.className = "caret off"; c2.className = "caret sm";
      if (j < sub.length) { s.textContent += sub.charAt(j++); setTimeout(typeSub, 18 + Math.random() * 22); }
      else setTimeout(function () { c2.className = "caret sm off"; }, 3500);
    }
    function typeMain() {
      if (i < full.length) { t.textContent += full.charAt(i++); setTimeout(typeMain, 60 + Math.random() * 60); }
      else setTimeout(typeSub, 350);
    }
    setTimeout(typeMain, 350);
  })();

  renderNew();
  refreshSuggestDatalists();
  if (restored) setStatus("Your unfinished inspection was restored from this device.", "ok");
  initFirebase();
  loadLiveFeed();
  try { if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js"); } catch (e) {}
})();
</script>
</body>
</html>
